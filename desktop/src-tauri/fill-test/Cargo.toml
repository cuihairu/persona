[package]
name = "persona-fill-test"
version = "0.1.0"
description = "Persona desktop fill injection cross-process test suite (test-only crate)"
license = "MIT"
edition = "2021"

# Why this is a standalone test-only crate: the cross-process injection suite
# needs a comctl32 v6 manifest embedded at link time (RUSTFLAGS
# /MANIFEST:EMBED; a bare test binary without an embedded manifest gets
# STATUS_ENTRYPOINT_NOT_FOUND when the loader binds comctl32 5.x, see
# windows/app.manifest and commit 745dca2). Leaving the integration tests inside
# the persona-desktop package would make cargo test link every bin in the package
# (including the tauri main program carrying the embedded manifest resource),
# triggering a CVT1100 duplicate resource error (MANIFEST, 1, 0x0409). The
# standalone package only builds the tests and the target-process bin, so it never
# clashes with the main package's manifest.
#
# Gating: the bin and the tests both sit behind the `fill-test-host` feature, so a
# normal build/package produces no binaries at all. Acceptance on real hardware:
#   cargo test --features fill-test-host --test desktop_fill_cross_process

[lib]
path = "lib.rs"

[[bin]]
name = "fill-test-host"
path = "src/bin/fill-test-host.rs"
required-features = ["fill-test-host"]

[features]
fill-test-host = []

[dependencies]
persona-desktop = { path = ".." }
# MockBiometricProvider (test wiring for AppState.biometric_provider)
persona-core = { path = "../../../core" }
# The command-layer cancellation timing suite
# (tests/desktop_fill_command_cancel.rs) drives the real command
# `desktop_fill_credential` through the tauri mock runtime: tokio test runtime +
# a per-test temp vault + snapshot id generation. Everything is already in the
# main package's Cargo.lock (same versions as desktop's dev-dependencies), so no
# new upstream dependency is introduced
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
uuid = { version = "1.6", features = ["v4"] }
tauri = { version = "2", features = ["test"] }

# The windows crate is gated to the Windows target only: on Linux/CI the bin and
# tests of this crate are all cfg'd out, so no windows compilation unit is pulled
# in (windows-future does not build on non-MSVC targets)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  # Target-process window class registration (RegisterClassW/WNDCLASSW live under the Gdi feature)
  "Win32_Graphics_Gdi",
  # GetModuleHandleW (System/LibraryLoader)
  "Win32_System_LibraryLoader",
  # EM_GETPASSWORDCHAR (mask character metadata, readable across processes)
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }
