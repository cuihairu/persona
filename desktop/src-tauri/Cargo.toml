[package]
name = "persona-desktop"
version = "0.1.0"
description = "Persona Desktop Application"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
edition = "2021"

[lib]
name = "persona_desktop"

# The cross-process injection test suite does not live in this package: see
# ../fill-test (a separate test-only crate, so the tauri main bin's embedded
# manifest in this package does not clash with RUSTFLAGS /MANIFEST:EMBED)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# E2EE sync host side (HttpSyncRemote/SyncAdminApi/envelope) + the account-domain
# proxy (AccountsApi in accounts/remote.rs); core's default features do not
# include these — CLI headless likewise enables them on demand
persona-core = { path = "../../core", features = ["remote-auth", "accounts"] }
persona-ssh-agent = { path = "../../agents/ssh-agent" }
# Connect HTTP endpoints (DR-1 A1 host-embedded; the router/three defense lines
# live in a separate crate shared with the CLI)
persona-connect-server = { path = "../../connect-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
dirs = "5.0"
byteorder = "1.5"
base64 = "0.22"
# Cloud-drive sync directory-change watcher (sync_watcher.rs): notify is the
# primary trigger source, falling back to mtime polling when the directory sits
# on a network filesystem or watching fails to start. Desktop only (core stays
# dependency-free of it).
notify = "8"
# Zeroizing wipes master-key wrapping intermediate values (same version as core;
# desktop is a separate workspace so .workspace inheritance cannot be used — same
# precedent as axum)
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# Field-level encrypted storage for the sync token (default v1 feature = the three platform backends apple/windows/zbus-secret-service)
keyring = "4"
tauri-plugin-dialog = "2"
# OS-level global hotkey (Quick Access summon, matrix item #22). Linux goes via
# X11 (global-hotkey uses x11-dl with runtime dlopen, does not link the X
# libraries, no extra system dependencies needed); on Wayland without a portal
# grabbing the hotkey fails -> the runtime state is reported honestly to the
# settings page, never silently.
tauri-plugin-global-shortcut = "2"

# OS auth dialog for biometric unlock (zbus is already in the Linux tree via
# keyring, so nothing new; windows pinned to 0.61 to match the version tauri
# already pulls in and avoid duplicating the whole tree)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Connect local automation endpoints (CONNECT_AUTOMATION_DESIGN DR-1 A1; same
# version precedent as the server — desktop is a separate workspace and declares
# it itself)
axum = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["block2"] }
# Secure Enclave route B' (biometric/macos_se.rs): SE key generation + ECIES.
# Compiles on macOS only; see docs/biometric-unlock-design.md §5 spike for
# real-device behavior.
objc2-security = { version = "0.3", features = [
  "SecAccessControl",
  "SecBase",
  "SecItem",
  "SecKey",
] }
# CF base types (CFBoolean/CFData/CFDictionary/CFError/CFNumber; CFType/
# CFRetained available unconditionally) — a direct dependency rather than the
# objc2-foundation re-exports
objc2-core-foundation = { version = "0.3", features = [
  "CFData",
  "CFDictionary",
  "CFError",
  "CFNumber",
  "CFString",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Security_Credentials_UI = gate layer Windows Hello (UserConsentVerifier);
# Win32_Security_Cryptography = the hardware wrapping layer's NCrypt (Passport
# KSP, see biometric/windows_tpm.rs and docs/biometric-unlock-design.md §6);
# Win32_Foundation = HRESULT/WIN32_ERROR constants (NTE_USER_CANCELLED etc.,
# needed for error routing)
windows = { version = "0.61", features = [
  "Security_Credentials_UI",
  "Foundation",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  # Desktop fill injection (desktop_fill.rs, #12): EDIT child control
  # enumeration / WM_SETTEXT direct write = WindowsAndMessaging; the Ctrl+V key
  # stroke and cross-thread focus = KeyboardAndMouse; clipboard round-trip
  # backup/restore = DataExchange + Memory + Ole (CF_UNICODETEXT); the thread id
  # for AttachThreadInput = Threading
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# mock_app() for AppHandle in tests; release builds keep tauri without this feature
tauri = { version = "2", features = ["test"] }

[workspace]
members = ["fill-test"]
