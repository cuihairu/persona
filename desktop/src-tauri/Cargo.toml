[package]
name = "persona-desktop"
version = "0.1.0"
description = "Persona Desktop Application"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
edition = "2021"

[lib]
name = "persona_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
persona-core = { path = "../../core" }
persona-ssh-agent = { path = "../../agents/ssh-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
dirs = "5.0"
byteorder = "1.5"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
# mock_app() for AppHandle in tests; release builds keep tauri without this feature
tauri = { version = "2", features = ["test"] }

[workspace]
