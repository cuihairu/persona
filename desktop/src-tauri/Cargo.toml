[package]
name = "persona-desktop"
version = "0.1.0"
description = "Persona Desktop Application"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
edition = "2021"

[lib]
name = "persona_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# E2EE sync 宿主侧（HttpSyncRemote/SyncAdminApi/信封）；core default 不含——
# CLI headless 同样按需开
persona-core = { path = "../../core", features = ["remote-auth"] }
persona-ssh-agent = { path = "../../agents/ssh-agent" }
# Connect HTTP 端点（DR-1 A1 宿主内嵌；router/三防线在独立 crate 与 CLI 共用）
persona-connect-server = { path = "../../connect-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
dirs = "5.0"
byteorder = "1.5"
base64 = "0.22"
# 主密钥包裹层中间值用 Zeroizing 清零（与 core 同版本；desktop 独立
# workspace，不能用 .workspace 继承——同 axum 先例）
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# sync token 字段级加密存储（默认 v1 feature = apple/windows/zbus-secret-service 三平台后端）
keyring = "4"
tauri-plugin-dialog = "2"

# biometric unlock 的 OS 认证弹框（zbus 已因 keyring 在 Linux 树里，无新增；
# windows 钉 0.61 对齐 tauri 已拉入的版本避免整树复制）
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Connect 本机自动化端点（CONNECT_AUTOMATION_DESIGN DR-1 A1；与 server 同
# 版本先例，desktop 独立 workspace 自行声明）
axum = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["block2"] }
# Secure Enclave 路线 B'（biometric/macos_se.rs）：SE 密钥生成 + ECIES。
# 仅 macOS 编译；真机行为见 docs/biometric-unlock-design.md §5 spike。
objc2-security = { version = "0.3", features = [
  "SecAccessControl",
  "SecBase",
  "SecItem",
  "SecKey",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Foundation"] }

[dev-dependencies]
tempfile = "3"
# mock_app() for AppHandle in tests; release builds keep tauri without this feature
tauri = { version = "2", features = ["test"] }

[workspace]
