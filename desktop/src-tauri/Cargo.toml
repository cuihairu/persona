[package]
name = "persona-desktop"
version = "0.1.0"
description = "Persona Desktop Application"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
edition = "2021"

[lib]
name = "persona_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
persona-core = { path = "../../core" }
persona-ssh-agent = { path = "../../agents/ssh-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
dirs = "5.0"
byteorder = "1.5"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
# sync token 字段级加密存储（默认 v1 feature = apple/windows/zbus-secret-service 三平台后端）
keyring = "4"
tauri-plugin-dialog = "2"

# biometric unlock 的 OS 认证弹框（zbus 已因 keyring 在 Linux 树里，无新增；
# windows 钉 0.61 对齐 tauri 已拉入的版本避免整树复制）
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Foundation"] }

[dev-dependencies]
tempfile = "3"
# mock_app() for AppHandle in tests; release builds keep tauri without this feature
tauri = { version = "2", features = ["test"] }

[workspace]
