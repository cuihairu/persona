<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persona - Digital Identity Manager</title>
    <script>
      // FOUC prevention: apply .dark to <html> before React mounts, following the persisted
      // preference / system theme (same algorithm as src/utils/theme.ts: a missing or
      // out-of-range value is treated as system)
      (function () {
        var pref;
        try {
          pref = localStorage.getItem('persona-theme');
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          ((pref == null || pref === 'system') &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
