services:
  persona-server:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/persona-server:${PERSONA_SERVER_TAG:-main}
    container_name: persona-server
    restart: unless-stopped
    ports:
      - "${PERSONA_SERVER_PORT:-3000}:3000"
    environment:
      PERSONA_SERVER_HOST: "0.0.0.0"
      PERSONA_SERVER_PORT: "3000"
      # Refuses to start when unset (the deploy-side counterpart of fail-closed:
      # the server never quietly comes online with the API disabled; the token
      # itself is injected only into the runtime environment, never into compose files)
      PERSONA_SERVER_TOKEN: "${PERSONA_SERVER_TOKEN:?PERSONA_SERVER_TOKEN is required}"
      # Per-device tokens (optional, layered on top of the legacy single token):
      # "laptop:tok1,phone:tok2". Device names are used for backup version
      # attribution (clients may not self-report); an invalid format fails startup
      PERSONA_SERVER_TOKENS: "${PERSONA_SERVER_TOKENS:-}"
      # Event store on a named volume so audit events survive container restarts
      PERSONA_SERVER_DB: /data/persona-server.db
      # Encrypted backups on the same named volume (the server only sees PERSENC1 ciphertext, which it cannot decrypt)
      PERSONA_SERVER_BACKUP_DIR: /data/backups
      # Cap on retained versions (0 = unlimited, the oldest are deleted when exceeded; global across devices)
      PERSONA_SERVER_BACKUP_MAX_VERSIONS: "${PERSONA_SERVER_BACKUP_MAX_VERSIONS:-0}"
      # oplog retention in days (0 = never prune, the default). Opening a window
      # means giving up the duty to replay history to devices that were offline
      # longer than the window: the window must be >= the slowest device's
      # offline cycle
      PERSONA_SERVER_OPS_RETENTION_DAYS: "${PERSONA_SERVER_OPS_RETENTION_DAYS:-0}"
      # Retention in days for the audit event replica (0 = never prune, the default); match the SIEM's pull cycle
      PERSONA_SERVER_EVENTS_RETENTION_DAYS: "${PERSONA_SERVER_EVENTS_RETENTION_DAYS:-0}"
    volumes:
      - persona-server-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  persona-server-data:
