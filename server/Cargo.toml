[package]
name = "persona-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional sync server for Persona (zero-knowledge architecture)"

[dependencies]
# 核心库
persona-core = { path = "../core" }

# Web框架
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["decompression-gzip"] }

# 数据库
sqlx.workspace = true

# 序列化
serde.workspace = true
serde_json.workspace = true

# 异步运行时
tokio.workspace = true

# 日志
tracing.workspace = true
tracing-subscriber.workspace = true

# 错误处理
anyhow.workspace = true
thiserror.workspace = true

# 时间处理
chrono.workspace = true

# UUID
uuid.workspace = true

# 游标编码（/api/v1/events 的 next_cursor）
base64.workspace = true

# SRP 设备认证（auth/srp.rs 复用 core 封装）+ 短期令牌随机源
srp.workspace = true
rand.workspace = true

# Bearer 令牌常量时间比较
subtle.workspace = true

# 备份端点：sha256 边写边算（去重键/ETag）、流式 body 读写、下载 ReaderStream
sha2.workspace = true
futures.workspace = true
tokio-util.workspace = true

# 环境变量（.env）
dotenvy = "0.15"

[dev-dependencies]
tempfile.workspace = true
# 测试构造 gzip 请求体（生产解压在 tower-http，压缩仅测试侧需要）
flate2.workspace = true