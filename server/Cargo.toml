[package]
name = "persona-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional sync server for Persona (zero-knowledge architecture)"

[dependencies]
# Core library
persona-core = { path = "../core" }

# Web framework
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["decompression-gzip"] }

# Database
sqlx.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Time handling
chrono.workspace = true

# UUID
uuid.workspace = true

# Cursor encoding (next_cursor for /api/v1/events)
base64.workspace = true

# SRP device authentication (auth/srp.rs reuses the core wrapper) + random source for short-lived tokens
num-bigint.workspace = true
rand.workspace = true

# Constant-time comparison for Bearer tokens
subtle.workspace = true

# Argon2id hash for account recovery codes (hash_recovery_code/verify_recovery_code_hash in accounts.rs)
argon2.workspace = true
hex.workspace = true

# Backup endpoints: sha256 computed as bytes are written (dedupe key/ETag), streaming body read/write, ReaderStream for downloads
sha2.workspace = true
futures.workspace = true
tokio-util.workspace = true

# Environment variables (.env)
dotenvy = "0.15"

# Login awareness (PERSONA-DEVALERT-001): NOTICE/ALERT fan-out to a Herald
# notification gateway over its REST surface
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
# Cross-crate integration tests: OplogCapture's item_key parameter is Zeroizing<[u8; 32]>
zeroize.workspace = true
tempfile.workspace = true
# Tests build gzip request bodies (production decompression lives in tower-http; compression is only needed on the test side)
flate2.workspace = true
# Cross-crate integration tests: core HttpRemoteAuthProvider <-> this router over real TCP (phase 1
# acceptance criterion "cross-crate handshake integration test")
reqwest.workspace = true
persona-core = { path = "../core", features = ["remote-auth"] }