[package]
name = "persona-cli"
version = "0.1.0"
edition = "2021"
authors = ["Persona Team"]
description = "Command-line interface for Persona digital identity management system"
license = "MIT"
repository = "https://github.com/cuihairu/persona"
homepage = "https://github.com/cuihairu/persona"
documentation = "https://docs.rs/persona-cli"
keywords = ["identity", "privacy", "security", "cli", "digital-identity"]
categories = ["command-line-utilities", "authentication", "cryptography"]
readme = "README.md"

[[bin]]
name = "persona"
path = "src/main.rs"

[dependencies]
# Core library
persona-core = { path = "../core", features = ["remote-auth", "accounts"] }
# Connect 本机自动化 HTTP 端点（serve 与桌面共用同一 router/三防线）
persona-connect-server = { path = "../connect-server" }

async-trait.workspace = true

# CLI framework
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
clap_complete = "4.4"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
config = "0.15"

# Terminal UI
console = "0.16"
indicatif = "0.17"
dialoguer = { version = "0.12", optional = true }
colored = "3.1"
crossterm = "0.27"
ratatui = "0.30"
rpassword = "7.5"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# sync_connect（桥发云参数）读 OS keyring 里的 sync token 与设备身份——
# 条目与桌面 token_store 同 service 名同键（persona-sync / persona-device）
keyring = "4"

# File system
dirs = "7.0"
walkdir = "2.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.4"
ed25519-dalek = "2.1"
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
byteorder = "1.5"
rand = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
flate2 = { workspace = true }
data-encoding = "2.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11"

# Security
secrecy = "0.8"
zeroize = "1.7"
hex = { workspace = true }

# Data formats
csv = { version = "1.3", optional = true }
tabled = "0.15"
# ssh generate：ed25519 公钥行解析出 SHA256 指纹（生成走 core，此处只读公钥行）
ssh-key.workspace = true

[dev-dependencies]
tempfile = "3.8"
# 1PUX 测试 fixture 现场打包 ZIP 容器
zip.workspace = true
assert_cmd = "2.0"
predicates = "3.0"
proptest = { workspace = true }
sqlx = { workspace = true }
# import-file 测试现场生成 OpenSSH 私钥 fixture
rand_core.workspace = true

[features]
default = ["interactive"]
interactive = ["dialoguer"]
json-output = []
csv-export = ["csv"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
