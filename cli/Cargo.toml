[package]
name = "persona-cli"
version = "0.1.0"
edition = "2021"
authors = ["Persona Team"]
description = "Command-line interface for Persona digital identity management system"
license = "MIT"
repository = "https://github.com/cuihairu/persona"
homepage = "https://github.com/cuihairu/persona"
documentation = "https://docs.rs/persona-cli"
keywords = ["identity", "privacy", "security", "cli", "digital-identity"]
categories = ["command-line-utilities", "authentication", "cryptography"]
readme = "README.md"

[[bin]]
name = "persona"
path = "src/main.rs"

[dependencies]
# Core library
persona-core = { path = "../core", features = ["remote-auth", "accounts"] }
# Connect local-machine automation HTTP endpoints (serve and desktop share the same router / three defense lines)
persona-connect-server = { path = "../connect-server" }

async-trait.workspace = true

# CLI framework
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
clap_complete = "4.4"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
serde_yaml = "0.9"
config = "0.15"

# Terminal UI
console = "0.16"
indicatif = "0.18"
dialoguer = { version = "0.12", optional = true }
colored = "3.1"
crossterm = "0.29"
ratatui = "0.30"
rpassword = "7.5"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# sync_connect (the bridge-sent cloud parameters) reads the sync token and device
# identity from the OS keyring — the entries use the same service name and keys
# as the desktop token_store (persona-sync / persona-device)
keyring = "4"

# File system
dirs = "7.0"
walkdir = "2.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.4"
ed25519-dalek = "3.0"
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
byteorder = "1.5"
rand = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
flate2 = { workspace = true }
data-encoding = "2.5"
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11"

# Security
secrecy = "0.10"
zeroize = "1.7"
hex = { workspace = true }

# Data formats
csv = { version = "1.3", optional = true }
tabled = "0.22"
# ssh generate: derive the SHA256 fingerprint from the ed25519 public key line (generation happens in core; here only the public key line is read)
ssh-key.workspace = true

# stop_agent's unix path sends SIGTERM directly via libc::kill (no forking an
# external kill, which could fail under memory pressure and be misread as
# Refused, leaving the pidfile behind)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
# Pack the 1PUX test fixture into a ZIP container on the fly
zip.workspace = true
assert_cmd = "2.0"
predicates = "3.0"
proptest = { workspace = true }
sqlx = { workspace = true }
# Generate the OpenSSH private key fixture on the fly for the import-file tests
rand_core.workspace = true

[features]
default = ["interactive"]
interactive = ["dialoguer"]
json-output = []
csv-export = ["csv"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
