# Toolchain pin (the precondition for cross-machine reproducible builds, item 2 of
# "remaining gaps" in docs/REPRODUCIBLE_BUILDS.md). CI is pinned in lockstep at
# dtolnay/rust-toolchain@<same version> in .github/workflows/*; upgrading means
# changing both places, and the new lints/behavior changes the compiler brings
# must be explicitly reviewed before landing.
# Note: pinning @stable in a workflow has no effect — this file is a
# directory-level override and always wins over the stable installed by the
# dtolnay action when cargo resolves through rustup (the root cause of the
# android E0463 in run 37155098351: stable only had the android target installed
# for stable, but compilation actually ran on 1.97.0, and rustup had no target to
# install on demand).
[toolchain]
channel = "1.97.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["aarch64-linux-android"]
