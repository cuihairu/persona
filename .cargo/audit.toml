# cargo-audit config (root workspace only; desktop/src-tauri and fuzz audit without this file).
# RUSTSEC-2023-0071 (rsa Marvin Attack): resolved 2026-11-26 — the lock migrated to stable
#   rsa 0.10.0 (crypto-glue 0.2.3 + ssh-key 0.7.0-rc.12, commit a24e304). Its ignore entry was
#   dropped 2026-11-27: with rsa >=0.10 pinned in the lock the advisory cannot hit, and removing
#   the ignore makes a future rsa <0.10 regression fail the audit instead of being silenced.
# RUSTSEC-2026-0387 (crypto-bigint timing variability): patched = >=0.7.6. The tree's own
#   crypto-bigint consumers moved to 0.7.x (k256/p256 on elliptic-curve 0.14; lock now 0.7.10).
#   A residual crypto-bigint 0.5.5 instance EXISTS IN THE LOCKFILE — cargo-audit is lockfile-level
#   and flags it via alloy-consensus 2.6.1 -> k256 0.13 -> elliptic-curve 0.13 -> crypto-bigint
#   0.5.5, plus a lock-graph edge alloy-primitives -> k256 0.13 (alloy-primitives is a direct core
#   dependency). The buildable graph does NOT enable the chain (closed 2026-11-09 with evidence,
#   see todo.md VULN-PERSONA-001 for the dated recheck trail): cargo-deny (graph-level, this
#   check's CI companion) and `cargo tree --offline --locked --target all -i crypto-bigint@0.5.5`
#   in all three workspaces print nothing, so no default build reaches the vulnerable version.
#   k256 0.14 (elliptic-curve 0.14 / crypto-bigint 0.7) exists upstream (2026-07), but no alloy
#   release adopts it. Re-check when alloy ships a k256-0.14-based release.
[advisories]
ignore = [
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: lockfile-level hit only (alloy -> k256 0.13); graph-level unreachable, blocked on upstream alloy
]
