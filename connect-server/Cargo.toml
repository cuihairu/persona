[package]
name = "persona-connect-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Connect 本机自动化 HTTP 端点（宿主内嵌 axum listener，桌面与 CLI 共用）"

[dependencies]
persona-core = { path = "../core" }
anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
# End-to-end contract tests for expired tokens need to rewrite expires_at on a real
# DB (production code never writes SQL directly, hence dev-only); sqlx/chrono are already in the workspace lockfile, so no new dependency.
sqlx = { workspace = true, features = ["chrono"] }
chrono = { workspace = true }
# Listener lifecycle tests need to read and write raw HTTP/1.1 requests over real TCP
# (io-util provides AsyncReadExt/AsyncWriteExt); production code never touches these traits, hence dev-only.
tokio = { version = "1.35", features = ["io-util", "net"] }
