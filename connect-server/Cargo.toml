[package]
name = "persona-connect-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Connect 本机自动化 HTTP 端点（宿主内嵌 axum listener，桌面与 CLI 共用）"

[dependencies]
persona-core = { path = "../core" }
anyhow = "1.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
# listener 生命周期测试要在真 TCP 上读写 HTTP/1.1 裸请求（io-util 提供
# AsyncReadExt/AsyncWriteExt）；生产代码不碰这些 trait，故只进 dev。
tokio = { version = "1.35", features = ["io-util", "net"] }
