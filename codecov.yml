# Codecov status policy (established 2026-11-08, landed in PR #148)
#
# The patch default target=auto anchors the goal to the project baseline
# (~97% in this repo). For diffs containing the following two kinds of lines,
# that goal is **structurally unreachable** — not a quality problem:
#   1. Cross-platform cfg(not(unix)) branches: coverage is instrumented and run
#      on a Linux runner, so Windows-only code is not in the artifact and counts
#      as "uncovered" in the patch;
#   2. Defensive / mutually exclusive unreachable branches: the fail-closed
#      peer_cred Err arm, test failure paths (bail/panic arms), the mutually
#      exclusive EOF vs RST timing, and instrumentation-attribution noise from
#      macro expansion and block-closing braces.
#
# patch is set to 90%: a real logic gap (dropping below 90%) still turns red.
# project keeps the default auto baseline comparison with zero tolerance —
# coverage regressions are caught as usual (main once turned red on -0.05%,
# fixed back to +0.05% by PR #148).
coverage:
  status:
    patch:
      default:
        target: 90%
