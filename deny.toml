# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# `version = 2` opts both [advisories] and [licenses] into the v2 behavior
# (cargo-deny PR #611): per-check lint levels were removed. Vulnerable,
# unmaintained, unsound and notice-rated crates are always denied unless
# exempted via `ignore`; a license is denied unless listed in `allow` or
# `exceptions`.

[advisories]
version = 2
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# Which dependencies to check for unmaintained/unsound advisories
# (all/workspace/transitive/none)
unmaintained = "all"
yanked = "deny"
# A list of advisory IDs to ignore
# In v2, unmaintained advisories are always denied, so unmaintained crates we
# accept for now are exempted here (equivalent to the old `unmaintained = "warn"`).
ignore = [
    # Bincode author marked it unmaintained; wait for ecosystem migration
    "RUSTSEC-2025-0141",
    # paste (via alloy-consensus/alloy-eips -> persona-core); upstream alloy still depends on it
    "RUSTSEC-2024-0436",
    # unsafe-libyaml (via serde_yaml -> persona-cli): repository archived
    # 2024-03, advisory re-published 2026-10-12. serde_yaml itself is archived
    # with no maintained successor (the serde_yml fork carries its own unsound
    # advisory), so there is nothing to upgrade to; YAML usage is
    # serialization of trusted in-memory values. Revisit when migrating off
    # serde_yaml.
    "RUSTSEC-2024-0449",
    # Marvin Attack timing sidechannel in rsa (via ssh-key + ssh-agent rsa-sha2-*
    # signing); upstream has published no patched release (Solution: none), so
    # there is nothing to upgrade to. Revisit when RustCrypto/RSA ships a fix.
    "RUSTSEC-2023-0071",
    # zbus 5.19.0 经 keyring -> zbus-secret-service-keyring-store 引入；
    # zbus_names 只有维护状态告警且 advisory 明确无安全升级路径。待
    # keyring 或其 secret-service 后端迁移到 zbus 6 后删除此 ignore。
    "RUSTSEC-2026-0371",
    # zvariant 5.15.0 同属上述 zbus 5.19.0 依赖链；此项是维护状态告警，
    # 上游已将实现并入 zbus 6，当前依赖尚未迁移。升级 keyring 后复查并删除。
    "RUSTSEC-2026-0370",
    # zvariant_derive 5.15.0 随 zvariant 5.15.0 被引入；advisory 无安全补丁，
    # 宏已并入 zbus 6。待 keyring 后端升级到 zbus 6 时一并移除并复查。
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# List of explicitly allowed licenses (everything else is denied)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "MITNFA",
    "CDLA-Permissive-2.0",
    # Boost Software License (OSI approved, FSF free): clipboard-win/error-code
    # via arboard -> tauri-plugin-clipboard-manager
    "BSL-1.0",
]
# The confidence threshold for detecting a license from license text
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "warn"
# The graph highlighting used when creating dotgraphs for crates with multiple versions
highlight = "all"
# List of crates that are allowed
allow = []
# List of crates to deny
deny = [
    # Denial reasons should be provided
    # { name = "openssl", version = "*" },
]
# Certain crates/versions that will be skipped when doing duplicate detection
skip = []
# Similarly named crates that are different
skip-tree = []

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []

[output]
# When outputting inclusion graphs in diagnostics that include features, this option can be used to specify the depth at which feature edges will be added. This option is included since the graphs can be quite large and the addition of features from the crate(s) to all of the graph roots can be far too verbose. This option can be overridden via `--feature-depth` on the cmd line
feature-depth = 1
