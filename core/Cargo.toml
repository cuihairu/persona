[package]
name = "persona-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core cryptographic and storage functionality for Persona"

[lib]
doctest = false

[dependencies]
# 加密相关
ring.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
# 设备认证 SRP-6a（auth/srp.rs，E2EE 同步轨道阶段 1）
srp.workspace = true
ed25519-dalek.workspace = true
# E2EE 同步 device envelope + group key 层级（sync/，阶段 2，DR-1）
x25519-dalek.workspace = true
hkdf.workspace = true
rand.workspace = true
getrandom.workspace = true
zeroize.workspace = true

# 密码学 - BIP/加密货币相关
bip39.workspace = true
bip32.workspace = true
k256.workspace = true
secp256k1.workspace = true
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
sha1.workspace = true
data-encoding.workspace = true
zxcvbn.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
bs58.workspace = true
bitcoin.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
bech32.workspace = true
p256.workspace = true
coset.workspace = true
base64.workspace = true

# Watchtower 泄露检查（HIBP k-anonymity）——可选：trait 与解析纯函数不依赖网络
# json feature：ServerEventSink 的 .json() 请求体需要（workspace 默认未开）
reqwest = { workspace = true, optional = true, features = ["json"] }

# 上报 wire 层 gzip（请求体压缩；reqwest 的 gzip feature 是响应解压，
# 不适用于 POST body）
flate2 = { workspace = true, optional = true }

# 数据库
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }

# 序列化
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true

# 异步运行时
tokio.workspace = true

# 日志
tracing.workspace = true
tracing-subscriber.workspace = true

# 错误处理
anyhow.workspace = true
thiserror.workspace = true

# 时间处理
chrono.workspace = true

# 其他依赖
async-trait.workspace = true
dirs.workspace = true
hex.workspace = true
tempfile.workspace = true
uuid.workspace = true
regex.workspace = true
url.workspace = true
# 1PUX（1Password 导出）ZIP 容器解析
zip.workspace = true

[dev-dependencies]
mockall.workspace = true
tokio-test = "0.4"
proptest.workspace = true
# 集成测试里的 BreachChecker stub 需要 trait 宏
async-trait.workspace = true
# RP 侧实现，用作 authenticator 产物的回归裁判；
# vendored openssl 使 webauthn-rs 在无系统 OpenSSL 头文件的环境可构建（仅测试）
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs.workspace = true

[features]
default = ["sqlite", "hibp", "favicon", "events-server", "backup"]
sqlite = ["sqlx"]
# HIBP k-anonymity HTTP 客户端；trait 与解析纯函数无需此 feature
hibp = ["dep:reqwest"]
# favicon 按需抓取 HTTP 客户端（独立于 hibp：关掉一个不影响另一个）
favicon = ["dep:reqwest"]
# ServerEventSink：审计事件 POST 到 persona-server（reqwest 本就随
# hibp/favicon 在 default 树，进 default 对下游零增量）
events-server = ["dep:reqwest", "dep:flate2"]
# 整库加密备份：PERSENC1 字节加密（flate2）+ VACUUM INTO 快照（sqlite）
# + persona-server 备份端点客户端（reqwest；同上在 default 树零增量）
backup = ["dep:reqwest", "dep:flate2", "sqlite"]
# SRP 设备认证的 HTTP 客户端编排（auth/remote_http.rs；reqwest 同上在
# default 树零增量）。E2EE 同步轨道阶段 1 客户端半边
remote-auth = ["dep:reqwest"]
