[package]
name = "persona-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core cryptographic and storage functionality for Persona"

[lib]
doctest = false

[dependencies]
# Crypto-related
ring.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
# Device authentication SRP-6a (auth/srp.rs, phase 1 of the E2EE sync track)
num-bigint.workspace = true
subtle.workspace = true
ed25519-dalek.workspace = true
# E2EE sync device envelope + group key hierarchy (sync/, phase 2, DR-1)
x25519-dalek.workspace = true
hkdf.workspace = true
rand.workspace = true
getrandom.workspace = true
zeroize.workspace = true

# Crypto - BIP/cryptocurrency related
bip39.workspace = true
bip32.workspace = true
k256.workspace = true
secp256k1.workspace = true
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
sha1.workspace = true
data-encoding.workspace = true
zxcvbn.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
scrypt.workspace = true
aes.workspace = true
ctr.workspace = true
bs58.workspace = true
bitcoin.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
bech32.workspace = true
p256.workspace = true
coset.workspace = true
base64.workspace = true
# OpenSSH private key file import (crypto/ssh_import.rs) + the PEM family (ssh_import_pem.rs)
ssh-key.workspace = true
pkcs1.workspace = true
pkcs8.workspace = true
# The Rng story for ssh-key 0.7: rand_core 0.10 removed OsRng, and SysRng
# (getrandom) can fail, so it is wrapped with UnwrapErr into an Infallible for the
# CryptoRng bound; both keygen and the test fixtures use it
rand_core.workspace = true

# Watchtower breach checks (HIBP k-anonymity) — optional: the trait and the pure
# parsing functions do not need the network
# the json feature: ServerEventSink's .json() request body needs it (not on by
# default at the workspace level)
reqwest = { workspace = true, optional = true, features = ["json"] }

# gzip on the reporting wire layer (request-body compression; reqwest's gzip
# feature is response decompression, so it does not apply to POST bodies)
flate2 = { workspace = true, optional = true }

# Database
sqlx = { workspace = true, features = ["chrono", "uuid"], optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Time handling
chrono.workspace = true

# Other dependencies
async-trait.workspace = true
dirs.workspace = true
hex.workspace = true
tempfile.workspace = true
uuid.workspace = true
regex.workspace = true
toml = "1.1"
# Host signal source for the context (overridden by PERSONA_HOST → gethostname, core/src/context.rs)
hostname = "0.4"
url.workspace = true
# 1PUX (1Password export) ZIP container parsing
zip.workspace = true
# Generic format import (#20): Bitwarden/Chrome/Firefox/1Password/KeePass CSV exports
csv.workspace = true

[dev-dependencies]
mockall.workspace = true
tokio-test = "0.4"
proptest.workspace = true
# The BreachChecker stubs in the integration tests need the trait macro
async-trait.workspace = true
# The RP-side implementation, used as the regression judge for authenticator
# artifacts; vendored openssl makes webauthn-rs buildable in environments without
# system OpenSSL headers (tests only)
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs.workspace = true

[features]
default = ["sqlite", "hibp", "favicon", "events-server", "backup"]
sqlite = ["sqlx"]
# HIBP k-anonymity HTTP client; the trait and the pure parsing functions do not need this feature
hibp = ["dep:reqwest"]
# On-demand favicon-fetch HTTP client (independent of hibp: disabling one does not affect the other)
favicon = ["dep:reqwest"]
# ServerEventSink: audit events POSTed to persona-server (reqwest is already in the
# default tree alongside hibp/favicon, so joining default is zero-cost for
# downstream)
events-server = ["dep:reqwest", "dep:flate2"]
# Whole-database encrypted backup: PERSENC1 byte encryption (flate2) + VACUUM INTO
# snapshots (sqlite) + a persona-server backup-endpoint client (reqwest; same
# as above, zero-cost in the default tree)
backup = ["dep:reqwest", "dep:flate2", "sqlite"]
# SRP device-authentication HTTP client orchestration (auth/remote_http.rs; reqwest is the same as
# above, zero-cost in the default tree). The client side of phase 1 of the
# E2EE sync track
remote-auth = ["dep:reqwest"]
# Accounts-domain HTTP client (accounts/remote.rs, persona-server /accounts/*).
# Not in default: the headless CLI has no accounts UI, and the desktop host
# enables it on demand
accounts = ["dep:reqwest"]
