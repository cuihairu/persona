[package]
name = "persona-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core cryptographic and storage functionality for Persona"

[lib]
doctest = false

[dependencies]
# 加密相关
ring.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
getrandom.workspace = true
zeroize.workspace = true

# 密码学 - BIP/加密货币相关
bip39.workspace = true
bip32.workspace = true
k256.workspace = true
secp256k1.workspace = true
sha2.workspace = true
sha3.workspace = true
ripemd.workspace = true
sha1.workspace = true
data-encoding.workspace = true
zxcvbn.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
bs58.workspace = true
bitcoin.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
bech32.workspace = true
p256.workspace = true
coset.workspace = true
base64.workspace = true

# Watchtower 泄露检查（HIBP k-anonymity）——可选：trait 与解析纯函数不依赖网络
reqwest = { workspace = true, optional = true }

# 数据库
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }

# 序列化
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true

# 异步运行时
tokio.workspace = true

# 日志
tracing.workspace = true
tracing-subscriber.workspace = true

# 错误处理
anyhow.workspace = true
thiserror.workspace = true

# 时间处理
chrono.workspace = true

# 其他依赖
async-trait.workspace = true
dirs.workspace = true
hex.workspace = true
tempfile.workspace = true
uuid.workspace = true
regex.workspace = true

[dev-dependencies]
mockall.workspace = true
tokio-test = "0.4"
proptest.workspace = true
# RP 侧实现，用作 authenticator 产物的回归裁判；
# vendored openssl 使 webauthn-rs 在无系统 OpenSSL 头文件的环境可构建（仅测试）
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs.workspace = true
url.workspace = true

[features]
default = ["sqlite", "hibp"]
sqlite = ["sqlx"]
# HIBP k-anonymity HTTP 客户端；trait 与解析纯函数无需此 feature
hibp = ["dep:reqwest"]
