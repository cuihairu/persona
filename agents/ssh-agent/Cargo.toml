[package]
name = "persona-ssh-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Persona SSH Agent - developer-friendly SSH agent backed by Persona vault"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
persona-core = { path = "../../core" }
dirs = { workspace = true }
hex = { workspace = true }

# Unix domain sockets and helpers
tokio-util = "0.7"
byteorder = "1.5"
ed25519-dalek = "3.0"
base64 = "0.23"
ring = { workspace = true }

# In-library private key loading in both formats (seed convention + imported
# OpenSSH PEM), plus rsa/p256 signing
ssh-key.workspace = true
rsa.workspace = true
p256.workspace = true

# Policy enforcement
toml = "1.1"
glob-match = "0.2"
chrono = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
mockall.workspace = true
# ssh-key 0.7's Rng convention: test fixture generation (rand_core 0.10's
# SysRng can fail, so UnwrapErr wraps it into Infallible for use at the
# CryptoRng boundary)
rand_core.workspace = true
rand.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
