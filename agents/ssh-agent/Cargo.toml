[package]
name = "persona-ssh-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Persona SSH Agent - developer-friendly SSH agent backed by Persona vault"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
persona-core = { path = "../../core" }
dirs = { workspace = true }
hex = { workspace = true }

# Unix domain sockets and helpers
tokio-util = "0.7"
byteorder = "1.5"
ed25519-dalek = "2.1"
base64 = "0.21"
ring = { workspace = true }

# 库内双格式私钥加载（seed 约定 + 导入的 OpenSSH PEM）与 rsa/p256 签名
ssh-key.workspace = true
rsa.workspace = true
p256.workspace = true

# Policy enforcement
toml = "0.8"
glob-match = "0.2"
chrono = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
mockall.workspace = true
# ssh-key 0.6 的 CryptoRngCore 口径：测试 fixture 生成
rand_core.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
