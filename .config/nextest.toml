# cargo-nextest config. CI (the Windows job in .github/workflows/ci.yml) runs with
# `--profile ci`: each test in its own process, marked slow past 60s and force-killed
# at 240s — hung tests surface as named failures instead of dragging down the whole
# test binary.
[profile.ci]
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 4 }
