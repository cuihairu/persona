# cargo-fuzz scaffolding (closes ROADMAP "no cargo-fuzz scaffolding yet", 2026-10-14).
#
# Standalone workspace: libFuzzer needs nightly's -Zsanitizer channel, and
# the root rust-toolchain.toml pins the whole tree to 1.97.0 stable (a
# prerequisite for reproducible builds, not negotiable); fuzz/rust-toolchain.toml
# does a local override, leaving the root workspace and CI unaffected.
# Can't use default-features = false: although the four targets are pure
# parse entry points, the `storage` module unconditionally references sqlx
# (`sqlite` only turns off the dep, not cfg-gated the module) — disabling it
# yields 246 compile errors.
#
# Usage (under fuzz/):
#   cargo fuzz run <target>                       # until Ctrl-C
#   cargo fuzz run <target> -- -max_total_time=60
#   cargo fuzz coverage <target>                  # coverage report
# Corpus and crash dumps land in fuzz/corpus, fuzz/artifacts (gitignored, not committed).
# Not in CI: no nightly runner on this machine, and long runs don't fit a pipeline.

[package]
name = "persona-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
# Pin exactly 0.4.13: this workspace's bundled Cargo.lock reuses the root's
# resolution result (cache hit); a loose "0.4" would resolve to an uncached
# newer version and an offline build would stall on a download.
libfuzzer-sys = "=0.4.13"
persona-core = { path = "../core" }
serde_json = "1.0"
uuid = "1.6"

[[bin]]
name = "ssh_openssh_key"
path = "fuzz_targets/ssh_openssh_key.rs"

[[bin]]
name = "keystore_json"
path = "fuzz_targets/keystore_json.rs"

[[bin]]
name = "context_map_toml"
path = "fuzz_targets/context_map_toml.rs"

[[bin]]
name = "passkey_creation_options"
path = "fuzz_targets/passkey_creation_options.rs"

# ASAN reports need line numbers: debug=1 keeps DWARF without full debug info.
[profile.release]
debug = 1
