name: persona_mobile
description: Persona Mobile Application - Master your digital identity
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # vault 路径（persona_service_init 的 db_path 入参）
  path_provider: ^2.1.4

  # dart:ffi 的 Utf8 扩展与 Allocator
  ffi: ^2.1.0

  # 安全存储（sync token / master password 缓存 / 生物识别凭据）
  flutter_secure_storage: ^9.2.2

  # 本地化/时间格式化（TOTP 剩余秒数）
  intl: ^0.19.0

  # 状态管理（极简）
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true