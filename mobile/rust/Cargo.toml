[package]
name = "persona-mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Mobile bindings for Persona"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
persona-core = { path = "../../core" }

# 异步运行时（FFI 边界 block_on 桥 + sqlx 池/Emitter 后台任务挂载）
tokio.workspace = true

# FFI
libc = "0.2"

[dev-dependencies]
sqlx.workspace = true
tempfile = "3"

[features]
default = []