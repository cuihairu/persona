[package]
name = "persona-mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Mobile bindings for Persona"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# remote-auth: SRP device-login HTTP client (auth/remote_http.rs) — the mobile
# side of the server's login-awareness surface (PERSONA-MOBILE-002 P0)
persona-core = { path = "../../core", features = ["remote-auth"] }

# Async runtime (block_on bridge at the FFI boundary + sqlx pool / Emitter background task hosting)
tokio.workspace = true

# JSON envelope for the business FFI (inbound/outbound are both JSON strings)
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# FFI
libc = "0.2"

# Error type of the core remote-auth client's returns (remote.rs box-free mapping)
anyhow.workspace = true

# JNI export layer for the Android host (jni_android.rs; compiled for the
# Android target only, consumed by Kotlin via System.loadLibrary + external
# fun, with the same JSON envelope as the C ABI)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[dev-dependencies]
sqlx.workspace = true
tempfile = "3"

[features]
default = []