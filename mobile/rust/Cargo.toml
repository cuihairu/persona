[package]
name = "persona-mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Mobile bindings for Persona"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
persona-core = { path = "../../core" }

# 异步运行时（FFI 边界 block_on 桥 + sqlx 池/Emitter 后台任务挂载）
tokio.workspace = true

# 业务 FFI 的 JSON 包络（入参/出参均为 JSON 字符串）
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# FFI
libc = "0.2"

# Android 宿主的 JNI 导出层（jni_android.rs；仅 Android 目标编译，
# Kotlin 侧经 System.loadLibrary + external fun 消费，JSON 包络同 C ABI）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
sqlx.workspace = true
tempfile = "3"

[features]
default = []