[workspace]
resolver = "2"
members = [
    "core",
    "server", 
    "mobile/rust",
    "cli",
    "agents/ssh-agent"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
description = "Master your digital identity. Switch freely with one click."

[workspace.dependencies]
# 加密相关
ring = "0.17"
argon2 = "0.5"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.0", features = ["zeroize"] }
rand = { version = "0.10", features = ["sys_rng", "thread_rng"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.8", features = ["derive"] }
flate2 = "1.0"

# 密码学 - BIP/加密货币相关
bip39 = "2.0"
bip32 = "0.5"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
secp256k1 = "0.28"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
sha1 = "0.10"
data-encoding = "2.5"
zxcvbn = "3"
hmac = "0.12"
pbkdf2 = "0.12"
bs58 = { version = "0.5", features = ["check"] }
# 链协议标准库：交易序列化/签名哈希/地址解析交给审计过的实现
bitcoin = "0.32"
alloy-consensus = "2.4"
alloy-eips = "2.4"
alloy-primitives = "1.7"
bech32 = "0.12"
# WebAuthn/passkey：P-256 与 COSE/CBOR 用审计过的实现
p256 = { version = "0.13", features = ["ecdsa"] }
coset = "0.3"
base64 = "0.22"
webauthn-rs = "0.5"

# 数据库
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Web框架 (服务器端)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# 配置管理
config = "0.14"

# 测试
mockall = "0.12"
proptest = "1.5"

# 其他依赖
async-trait = "0.1"
dirs = "5.0"
hex = "0.4"
tempfile = "3.8"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
