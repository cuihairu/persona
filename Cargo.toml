[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "relay",
    "mobile/rust",
    "cli",
    "agents/ssh-agent",
    "connect-server"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Persona Team"]
license = "MIT"
repository = "https://github.com/cuihairu/persona"
description = "Master your digital identity. Switch freely with one click."

[workspace.dependencies]
# Crypto-related
ring = "0.17"
argon2 = "0.6"
aes-gcm = "0.11"
# SRP-6a (RFC 5054): device authentication (phase 1 of the E2EE sync track).
# RustCrypto/PAKEs move slowly (0.7 stuck at rc) — correctness is locked by
# the RFC 5054 Appendix B vector tests (core/src/auth/srp.rs), and callers are
# isolated through a wrapper so the implementation can be swapped wholesale
# (design doc DR-2)
ed25519-dalek = { version = "3.0", features = ["pkcs8", "zeroize"] }
# E2EE sync device envelope (E2EE_SYNC_DESIGN DR-1): X25519 ephemeral DH +
# HKDF-SHA256 expansion (key‖nonce) + AES-256-GCM; the composition layer is
# about 30 hand-written lines, covered by round-trip/tamper/cross-device
# failure tests (core/src/sync/envelope.rs)
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
hkdf = "0.13"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
num-bigint = "0.5"
flate2 = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Crypto - BIP/cryptocurrency related
bip39 = "3.0"
bip32 = { version = "0.6", features = ["alloc"] }
k256 = { version = "0.14", features = ["ecdsa", "sha256"] }
secp256k1 = "0.33"
sha2 = "0.11"
sha3 = "0.12"
ripemd = "0.2"
sha1 = "0.11"
data-encoding = "2.5"
zxcvbn = "3"
hmac = "0.13"
pbkdf2 = "0.13"
# Web3 Secret Storage v3 keystore (wallet JSON interop): scrypt/pbkdf2 derivation
# + AES-128-CTR + keccak MAC (the web3 standard uses keccak, not sha3-256;
# the sha3 crate provides it)
scrypt = "0.12"
aes = "0.9"
ctr = "0.10"
bs58 = { version = "0.5", features = ["check"] }
# Chain-protocol standard crates: transaction serialization / signature hashing /
# address parsing are delegated to audited implementations
bitcoin = "0.32"
alloy-consensus = "2.4"
alloy-eips = "2.4"
alloy-primitives = "1.7"
bech32 = "0.12"
# WebAuthn/passkey: P-256 and COSE/CBOR use audited implementations
p256 = { version = "0.14", features = ["ecdsa"] }
coset = "0.4"
base64 = "0.23"
webauthn-rs = "0.6"
# SSH keys: parsing/serialization of the OpenSSH private key container
# (openssh-key-v1/aes*-ctr/cbc/bcrypt-pbkdf) and public-key line/fingerprint
# formatting are delegated to the audited ssh-key; the p256 feature supports
# ECDSA P-256 generation/conversion (the ecdsa feature only provides types);
# rsa supports the agent's rsa-sha2-* signatures
ssh-key = { version = "0.7.0-rc.12", features = ["ed25519", "rsa", "ecdsa", "p256", "encryption", "rand_core"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
# PEM-family private key import (PKCS#8/PKCS#1/SEC1, see core/src/crypto/ssh_import_pem.rs):
# field-level decoding is delegated to pkcs1/pkcs8 (same RustCrypto family);
# pkcs8's encryption feature unlocks encrypted PKCS#8 (PBES2); ed25519-dalek's
# pkcs8 feature provides the PKCS#8 → SigningKey conversion
pkcs1 = { version = "0.8", features = ["std", "pem"] }
pkcs8 = { version = "0.11", features = ["std", "pem", "encryption"] }
rand_core = "0.10"

# Database
# 0.9 dropped the combined runtime+TLS feature, so they are spelled out
# separately; sqlite does not use TLS, and the ring Provider aligns with the
# repo's existing ring (reqwest 0.13's rustls defaults to the aws-lc provider)
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-rustls-ring"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# bincode is pinned at 1.3: since 3.0.0 upstream has marked it unmaintained and
# published a "tombstone" release whose lib unconditionally emits
# compile_error!(https://xkcd.com/2347/), and the 3.x API is incompatible with
# our call sites. dependabot's bincode bumps have turned main red three times
# (#46/#59/#88) and are already ignored in dependabot.yml. Moving to 3.x needs a
# usable upstream release plus a full API migration.
bincode = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
# Streaming response for backup downloads (ReaderStream: AsyncRead → Stream)
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client (Watchtower breach checks against HIBP k-anonymity; rustls avoids
# an openssl dependency)
# Since 0.13, query/form are split into optional features; sync/oplog GETs that
# build query strings use query
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }

# Web framework (server side)
tower = "0.5"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace", "decompression-gzip"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Configuration management
config = "0.15"

# Testing
mockall = "0.15"
proptest = "1.5"

# Other dependencies
async-trait = "0.1"
# Generic format import (FEATURE_GAP_ANALYSIS #20): CSV parsing (export column
# shape sniffing for Bitwarden/Chrome/Firefox/1Password/KeePass)
csv = "1.3"
dirs = "7.0"
hex = "0.4"
tempfile = "3.8"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Dedicated to the mobile FFI artifact (the precondition for the panic defense
# shared by Android/iOS/HarmonyOS): release's panic="abort" would kill the
# process before unwinding, so the catch_unwind defense at the mobile/rust
# lifecycle entry points (panic → an error result instead of a crash) only
# triggers under an unwind build. The android job in desktop-build.yml builds
# the .so with `--profile mobile-ffi` (output under target/<target>/mobile-ffi/).
[profile.mobile-ffi]
inherits = "release"
panic = "unwind"
