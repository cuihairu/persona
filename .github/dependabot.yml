# Dependabot version updates: only the scheduled upgrade PR track is enabled here.
# Security alerts live on a separate track in the repo settings, are unaffected by
# this file, and keep their defaults.
#
# The build/ci PR title prefixes are both taken from the types list allowed by
# conventional-commits.yml (dependabot's default "Bump xxx" titles fail the
# semantic-pull-request gate).
version: 2
updates:
  # pnpm workspace (desktop / browser/chromium-extension / website,
  # resolved uniformly by the root pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"

  # docs site: standalone npm install (--ignore-workspace; see the dual-lockfile ban in docs.yml)
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"
    # mermaid is excluded from dependabot: vitepress-plugin-mermaid@2.0.17 only
    # allows mermaid 11 as a peer, so dependabot's major bump PRs (#132/#159)
    # turned the docs npm ci red with ERESOLVE as soon as they merged. Upgrades
    # are now reviewed by hand once the plugin loosens its peer range (see todo.md).
    # Re-checked 2026-11-17: the plugin's latest is still 2.0.17 with peer `10 || 11`,
    # i.e. still not loosened.
    ignore:
      - dependency-name: "mermaid"
        update-types:
          - "version-update:semver-major"

  # Rust workspace (core / server / cli / mobile/rust / agents / connect-server)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"
    # bincode is excluded from dependabot: since 3.0.0 upstream has stopped maintaining
    # it and publishes a "tombstone" release whose lib unconditionally emits
    # compile_error!(https://xkcd.com/2347/), and the 3.x API is incompatible with
    # our call sites. Its bumps have turned main red three times (#46/#59/#88), so it
    # is pinned at 1.3; moving to 3.x needs a usable upstream release plus a full API
    # migration, after which this ignore can be lifted.
    ignore:
      - dependency-name: "bincode"

  # GitHub Actions (no dev/prod distinction, so no groups)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # dtolnay/rust-toolchain is excluded from dependabot: its version tags appear
    # upstream only after the release flow, trailing the semver number, so
    # dependabot opens PRs against version numbers that do not exist (phantom
    # versions, three times already: #32/#45 died instantly, #62 was merged and
    # turned all of main red). Toolchain upgrades are now aligned by hand on a
    # schedule (real latest stable pinned at @1.99.0, six workflow references).
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
