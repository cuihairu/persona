# Dependabot version updates：只开定期升级 PR 轨道。
# 安全告警（alerts）是仓库设置侧的独立轨道，不受本文件影响，保持默认。
#
# PR 标题前缀 build/ci 均取自 conventional-commits.yml 允许的 types 列表
# （dependabot 默认的 "Bump xxx" 标题过不了 semantic-pull-request gate）。
version: 2
updates:
  # pnpm workspace（desktop / browser/chromium-extension / website，
  # 根 pnpm-lock.yaml 统一解析）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"

  # docs 站：独立 npm 安装（--ignore-workspace，见 docs.yml 的双锁文件禁令）
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"

  # Rust workspace（core / server / cli / mobile/rust / agents / connect-server）
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        dependency-type: "development"
    commit-message:
      prefix: "build"
    # bincode 不走 dependabot：3.0.0 起上游停维护并发布「墓碑」版本，
    # lib 无条件 compile_error!(https://xkcd.com/2347/) 拒绝编译，且 3.x
    # API 不兼容我们的调用点。它的升级已三次把 main 打红（#46/#59/#88），
    # 钉在 1.3；要迁 3.x 得等上游出可用版本 + 全量改 API，届时再放开。
    ignore:
      - dependency-name: "bincode"

  # GitHub Actions（无开发/生产依赖之分，不分组）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # dtolnay/rust-toolchain 不走 dependabot：它的版本 tag 由上游随发布流
    # 晚于 semver 数字出现，dependabot 会拿不存在的版本号开 PR（幻影版本，
    # 已三次：#32/#45 秒挂未遂、#62 被合入致 main 全红）。工具链升级改为
    # 人工定期整体对齐（真实最新 stable 钉 @1.99.0，六处 workflow 引用）。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
