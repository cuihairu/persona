name: Deploy VitePress to GitHub Pages

# docs/ changes → build the VitePress site → deploy to the GitHub Pages
# project site https://cuihairu.github.io/persona/. Dead-link checking and
# prettier auto-formatting live in docs.yml (both workflows are triggered in
# parallel by the same push; its auto-commit carries [skip ci], so it does not
# re-trigger this file). The shape follows cuihairu/hello-game's deploy-docs.yml
# (upload-pages-artifact + deploy-pages, two jobs).
#
# Prerequisite: the repo's Pages is enabled with build_type=workflow
# (settings → pages), and this file is its deployment source.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # config lastUpdated: true needs full git history

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # docs/ is a standalone npm install (not a pnpm workspace member), same policy as docs.yml
      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build with VitePress
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
