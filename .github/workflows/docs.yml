name: docs

# When the docs/ directory changes (the VitePress site + root-level
# engineering markdown): prettier auto-format → VitePress build (with its
# built-in dead-link check, which fails the run) → auto-commit the fixups when
# there is a diff. Fork PRs cannot push, so they are only checked.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # On PRs, check out the head branch (the default merge ref cannot be pushed back to); same-repo PRs may be committed to directly
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Guard: docs/ has exactly one lockfile, and it must be npm's. A single
      # pnpm install (62940e8, which added mermaid) leaves docs/pnpm-lock.yaml
      # behind while package-lock.json stays untouched, and `npm ci` then fails
      # with EUSAGE "not in sync" — local pnpm builds were all green while CI
      # was red, and the error only said "lockfile out of sync" without
      # pointing at the real cause. Self-check before installing, with a clear
      # message.
      - name: Guard single lockfile (npm only)
        working-directory: docs
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "::error::docs/ 存在 pnpm-lock.yaml/yarn.lock——本目录由 npm ci 安装（见下方步骤），第二份锁文件必然漂移。请改用 npm install 并只提交 package-lock.json"
            exit 1
          fi

      # docs/ is a standalone npm install (not a pnpm workspace member); see docs/package-lock.json for the lockfile
      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Prettier format
        working-directory: docs
        # The version evolves alongside .prettierrc.json / .prettierignore; the ignore file excludes node_modules, build output and the lockfile
        run: npx --yes prettier@3.6.2 --write .

      - name: VitePress build (dead link check)
        working-directory: docs
        run: npm run build

      # push(main) and same-repo PRs auto-commit the fixups; fork PRs are only checked.
      # [skip ci] prevents recursion (pushes with GITHUB_TOKEN never trigger CI anyway, belt and braces).
      - name: Commit formatted docs
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: 'docs: 自动修复 markdown 格式 [skip ci]'
          file_pattern: 'docs/**'
