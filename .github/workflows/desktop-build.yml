# Desktop multi-platform packaging: Linux (deb/rpm/AppImage), Windows
# (NSIS), macOS (dmg).
#
# Windows 只发 NSIS 一种安装器（2026-09-25 起）：同时发 MSI 会造成
# nsis(per-user)/msi(per-machine) 混装与卸载残留（msiexec 升级只认
# UpgradeCode，不会清 NSIS 安装）。NSIS 安装器对旧 msi 安装有迁移
# 卸载逻辑，反之没有。详见 docs/WINDOWS_INSTALLER.md。
#
# Three entry points:
#   - push tag v*        → official GitHub Release with generated notes
#   - schedule (daily)   → rolling `nightly` prerelease (assets overwritten)
#   - workflow_dispatch  → build only; tick `upload` to publish to nightly
#
# Staleness gate（2026-09-29）：schedule 触发时先比对 main HEAD 的提交时间，
# 超过 48h 没有新提交就整条流水线 skip（gate 绿、build/android/release 全
# skipped，不烧 CI 时长）；tag/手动触发永不跳过。
#
# Android（2026-09-30）：persona-mobile aarch64 cdylib 交叉编译 →
# Flutter 壳（mobile/）jniLibs → **arm64 APK** 进 artifact
# （android-apk-arm64）；so 本体另存 android-jni-arm64 供链接验证。
# 上架口径（2026-10-01 起）：**nightly 每日构建带 APK**（下载 pattern
# 含 android-apk-arm64，改名为 Persona_<ver>_arm64.apk）；tag 正式版
# 暂不发 APK——移动端还是最小闭环，等稳定后随正式发版放开。
#
# Browser extension（2026-11-14）：Chromium MV3 包（manifest.json 在
# zip 根）进 artifact（extension-chromium）；nightly 双命名资产
# persona-nightly-extension-chrome.zip / persona-nightly-extension-edge.zip
# ——Chrome/Edge 同包双名。Safari 需 Xcode 转换 + 签名账号，**不在
# nightly**（todo 另立）。tag 正式版暂不发扩展，口径与 APK 一致。
#
# OpenWrt（2026-11-14）：persona-server musl 静态编译（x86_64 + aarch64）
# → packaging/openwrt/build-ipk.sh 出三件套 ipk（persona 主包 arch 相关、
# luci-app/app-meta arch=all）。nightly 资产 persona-nightly-openwrt-*.ipk；
# aarch64 无真机，做结构检查（ELF 机器 + 静态链接 + ipk 成员）。tag 正式版
# 暂不发，口径与 APK/扩展一致。
#
# Binaries are unsigned (SmartScreen/Gatekeeper will warn on install);
# architecture-pinned per runner: linux/windows x64, macos arm64.
name: Desktop Build

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 18 * * *' # daily 02:23 Beijing, off the whole-hour marks
  workflow_dispatch:
    inputs:
      upload:
        description: '上传产物到 nightly release（覆盖旧 nightly）'
        type: boolean
        default: false

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: staleness gate
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Skip daily build when main has no fresh commits (<= 48h)
        id: gate
        shell: bash
        run: |
          # 只有 schedule 做新鲜度判断：tag 是正式发版、dispatch 是人手动
          # 点的，都不允许被 staleness 拦下。
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "event ${GITHUB_EVENT_NAME}: always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( now - last ))
          echo "main HEAD age: ${age}s ($(date -u -d "@${last}" 2>/dev/null || date -u -r "${last}" 2>/dev/null))"
          if (( age <= 60 * 60 * 48 )); then
            echo "fresh enough (<= 48h) — build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main HEAD older than 48h — skip whole daily build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    # spike 探针在无硬件的 VM 上按设计会"如实失败"，但绝不允许它挂死 job
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v6.1.1
        # Version comes from the root package.json `packageManager` field
        # (pnpm@10.22.0); specifying `version` here conflicts with it.

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm

      - name: Install JS dependencies (desktop slice only)
        shell: bash
        run: pnpm install --frozen-lockfile --filter persona-desktop...

      # 更新检测渠道元信息（desktop/src/utils/updateCheck.ts 经 vite define 读入）：
      # 每日构建 = nightly，比对 desktop-build workflow 最近成功 run；release 渠道
      # 由未来的发版流水线注入 VITE_UPDATE_CHANNEL=release
      - name: Record build metadata (update-check channel)
        shell: bash
        run: |
          echo "VITE_UPDATE_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build bundles
        working-directory: desktop
        shell: bash
        env:
          VITE_UPDATE_CHANNEL: ${{ env.VITE_UPDATE_CHANNEL }}
          VITE_BUILD_SHA: ${{ env.VITE_BUILD_SHA }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

      # 生物识别硬件包裹 spike（docs/biometric-unlock-design.md §5.2/§6.1）。
      # runner 是 VM：macos 无 Secure Enclave / Touch ID，windows 通常无已
      # 注册的 Hello——探针会如实失败并把 OSStatus/HRESULT 打进日志，这份
      # 真实输出就是本步骤的产出（人工回填设计文档）；非门禁，探针 ok 位
      # 不影响 job 结论。--nocapture 让 SPIKE 行进日志。
      - name: Biometric spike probes (VM — record real capability, not a gate)
        if: runner.os != 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        # 非门禁：探针 ok 位、乃至 runner 环境根本跑不起测试二进制（Windows
        # runner 实测 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND——Tauri 测试
        # 二进制的原生 loader 依赖，见设计文档 §6.3），都不该挡打包。
        continue-on-error: true
        run: cargo test --lib spike_probes_print_report -- --ignored --nocapture

  # persona-mobile 的 Android 交叉编译（aarch64 cdylib）+ 原生 Kotlin APK。
  # 链：cargo ndk 出 libpersona_mobile.so（mobile-ffi profile，panic 防线
  # 需 unwind）→ 拷入 Kotlin 工程 jniLibs → gradle assembleRelease
  # （arm64-v8a 单 ABI）。产物只进 artifact——铁律：
  # 每日构建不发 release（release job 的 download pattern 只认
  # desktop-*，天然隔离）；libpersona_mobile.so 另存 android-jni-arm64
  # artifact 供链接验证/壳外集成。
  android:
    name: android (aarch64 APK)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: android-aarch64

      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Build persona-mobile cdylib (arm64-v8a)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # mobile-ffi（release + unwind）：panic 在 FFI 边界被 catch_unwind
        # 收编为错误结果——release 的 panic=abort 会让防线失效（进程直接死）
        run: cargo ndk -t arm64-v8a build -p persona-mobile --profile mobile-ffi

      - name: Upload android jniLib artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-jni-arm64
          path: target/aarch64-linux-android/mobile-ffi/libpersona_mobile.so
          if-no-files-found: error

      - name: Bundle cdylib into Kotlin app jniLibs
        shell: bash
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/mobile-ffi/libpersona_mobile.so \
            mobile/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK (arm64-v8a, native Kotlin)
        working-directory: mobile/android
        shell: bash
        # 纯 Kotlin 工程直出单 ABI 包：abiFilters 已限定 arm64-v8a，非 arm64
        # 设备不会装到缺 so 的包——运行时 UnsatisfiedLinkError 不可能出现
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload android APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apk-arm64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # 浏览器扩展 nightly 打包（Chromium MV3）：tsc 出 dist/ → zip（
  # manifest.json 必须在压缩包根，Load unpacked 直读）。产物只进
  # artifact——与 APK 同一铁律：release job 的 download pattern 只在
  # 非 tag run 认 extension-chromium，tag 正式版天然隔离。
  extension:
    name: browser extension (chromium zip)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        # Version comes from the root package.json `packageManager` field
        # (pnpm@10.22.0); specifying `version` here conflicts with it.

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies (extension slice only)
        shell: bash
        run: pnpm install --frozen-lockfile --filter persona-chromium-extension...

      - name: Build extension
        shell: bash
        run: pnpm --filter persona-chromium-extension run build

      - name: Zip package (manifest.json at archive root)
        shell: bash
        # 结构自检先于打包：manifest 缺位或入口文件缺失时直接红，不让
        # 一个装不出来的 zip 进 nightly。
        run: |
          cd browser/chromium-extension
          test -f manifest.json
          test -f dist/background.js
          test -f public/popup.html
          zip -qr "$GITHUB_WORKSPACE/persona-extension.zip" manifest.json public dist
          unzip -l "$GITHUB_WORKSPACE/persona-extension.zip" | awk '{print $4}' | grep -qx 'manifest.json'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-chromium
          path: persona-extension.zip
          if-no-files-found: error

  # OpenWrt IPK 打包：persona-server musl 静态编译。aarch64 腿走原生
  # ARM runner（ubuntu-24.04-arm，meshlet 先例）——不依赖外网交叉工具
  # 链（musl.cc 在 GH runner 上不可达，实测红过一次）；每腿各自
  # apt musl-tools。三件套 ipk（persona/luci-app/app-meta）由
  # build-ipk.sh 出；脚本门禁（shellcheck + sh -n + luac5.1）内联腿前。
  openwrt:
    name: openwrt ipk (${{ matrix.arch }} musl)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: openwrt-${{ matrix.arch }}-musl

      - name: Install packaging gate tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools lua5.1 file

      - name: Validate packaging scripts (shellcheck / sh -n / luac5.1)
        shell: bash
        run: |
          shellcheck packaging/openwrt/build-ipk.sh
          sh -n packaging/openwrt/build-ipk.sh \
            packaging/openwrt/etc/init.d/persona \
            packaging/openwrt/CONTROL/postinst packaging/openwrt/CONTROL/prerm
          # LuCI app gate: parse the Lua controller/model with Lua 5.1
          # (the interpreter LuCI runs on OpenWrt).
          luac5.1 -p packaging/openwrt/usr/lib/lua/luci/controller/persona.lua \
            packaging/openwrt/usr/lib/lua/luci/model/cbi/persona.lua

      - name: Build persona-server (musl static)
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build -p persona-server --target ${{ matrix.arch }}-unknown-linux-musl --release

      - name: Package IPKs + structural checks
        shell: bash
        run: |
          set -euo pipefail
          OUT=out/openwrt
          packaging/openwrt/build-ipk.sh \
            "target/${{ matrix.arch }}-unknown-linux-musl/release" "$OUT"
          # aarch64 无真机：结构检查代替（ELF 机器 + 静态链接 + ipk 成员
          # + data.tar.gz 目录条目——opkg 不为纯文件成员建父目录）。
          file "target/${{ matrix.arch }}-unknown-linux-musl/release/persona-server" \
            | tee /dev/stderr | grep -q 'static-pie linked'
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ipk="$OUT/persona_${version}-1_${{ matrix.arch }}.ipk"
          test -f "$ipk"
          tar -tzf "$ipk" | grep -qx './debian-binary'
          rm -rf /tmp/ipk-verify && mkdir /tmp/ipk-verify
          tar -xzf "$ipk" -C /tmp/ipk-verify
          tar -tzf /tmp/ipk-verify/data.tar.gz | grep -qx 'usr/'
          tar -xzOf /tmp/ipk-verify/data.tar.gz usr/bin/persona-server | file -
          find "$OUT" -type f -printf '%s %p\n' | sort -n

      # arch=all 两包（luci-app / app-meta）随 x86_64 腿上传一份即可——
      # aarch64 腿也构建了它们（自检用），但 artifact 只带主包，避免
      # release 下载合并出同名资产。
      - name: Upload arch ipk artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openwrt-ipk-${{ matrix.arch }}
          path: out/openwrt/persona_*_${{ matrix.arch }}.ipk
          if-no-files-found: error

      - name: Upload arch-all ipk artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openwrt-ipk-all
          path: |
            out/openwrt/luci-app-persona_*_all.ipk
            out/openwrt/app-meta-persona_*_all.ipk
          if-no-files-found: error

  release:
    name: publish
    needs: [gate, build, android, extension, openwrt]
    if: >-
      needs.gate.outputs.should_build == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      inputs.upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # nightly/dispatch 带 APK + 扩展 zip + OpenWrt ipk；tag 正式版只发
      # 桌面包（见文件头口径）。needs 已含全部 build job，artifact 必然
      # 已就绪。
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop-*' || '{desktop-*,android-apk-arm64,extension-chromium,openwrt-ipk-*}' }}
          path: dist
          merge-multiple: true

      - name: Rename Android APK (match desktop asset naming)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if [ -f dist/app-release.apk ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            mv dist/app-release.apk "dist/Persona_${version}_arm64.apk"
            echo "renamed to Persona_${version}_arm64.apk"
          else
            echo "::error::android APK missing from downloaded artifacts"
            exit 1
          fi

      - name: Rename extension zip (Chrome/Edge dual-name, same package)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # Chromium 内核同包双名：Chrome 与 Edge 各自的发布页习惯自己的
        # 文件名，内容逐字节一致（SHA256 相同）。
        run: |
          if [ -f dist/persona-extension.zip ]; then
            cp dist/persona-extension.zip dist/persona-nightly-extension-chrome.zip
            cp dist/persona-extension.zip dist/persona-nightly-extension-edge.zip
            rm dist/persona-extension.zip
            echo "dual-named chrome/edge extension zips"
          else
            echo "::error::extension zip missing from downloaded artifacts"
            exit 1
          fi

      - name: Rename OpenWrt ipks (nightly naming)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # 主包按架构出 persona-nightly-openwrt-<arch>.ipk；LuCI 界面与
        # iStore 元数据包是 arch=all，两个架构共用同一份。
        run: |
          ok=1
          for pair in \
            "persona_*_x86_64.ipk:persona-nightly-openwrt-x86_64.ipk" \
            "persona_*_aarch64.ipk:persona-nightly-openwrt-aarch64.ipk" \
            "luci-app-persona_*_all.ipk:persona-nightly-openwrt-luci-app-all.ipk" \
            "app-meta-persona_*_all.ipk:persona-nightly-openwrt-app-meta-all.ipk"
          do
            src="${pair%%:*}"
            dst="${pair##*:}"
            # set -- expands the glob (a quoted test would compare the
            # literal pattern); build-ipk emits exactly one match each.
            # shellcheck disable=SC2086  # glob expansion is the point
            set -- dist/$src
            if [ -f "$1" ]; then
              mv "$1" "dist/$dst"
              echo "renamed to $dst"
            else
              echo "::error::openwrt ipk missing from downloaded artifacts: $src"
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Generate SHA256SUMS + asset manifest (nightly only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # 临时文件落在 dist 外：shell 会先创建重定向目标再跑 find，写在
        # dist 里会被自己的遍历收录（自校验必 FAILED）。落位用 mv。
        run: |
          cd dist
          find . -type f -printf '%P\0' | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.tmp
          {
            echo "# persona nightly assets — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "# extension-chrome/edge are the same package under two names"
            echo "# Safari is not shipped in nightly (needs Xcode conversion + signing)"
            while IFS= read -r f; do
              printf '%-64s %10s\n' "$f" "$(du -h "$f" | cut -f1)"
            done < <(find . -type f -printf '%P\n' | sort)
          } > ../ASSETS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
          mv ../ASSETS.tmp ASSETS.txt

      - name: Compute release target
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly build $(date -u +%F)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify downloaded bundles
        shell: bash
        run: |
          found=$(find dist -type f | wc -l)
          if [ "$found" -eq 0 ]; then
            echo "::error::no bundle files found under dist/"
            exit 1
          fi
          find dist -type f -printf '%s %p\n' | sort -n

      - name: Remove previous nightly release
        if: steps.rel.outputs.tag == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ steps.rel.outputs.prerelease == 'false' }}
          # artifacts keep their bundler subdirectories (deb/, nsis/, ...)
          files: dist/**/*
