# Desktop multi-platform packaging: Linux (deb/rpm/AppImage), Windows
# (NSIS), macOS (dmg).
#
# Windows ships only the NSIS installer (since 2026-09-25): shipping MSI as
# well leads to mixed nsis(per-user)/msi(per-machine) installs and uninstall
# leftovers (msiexec upgrades only honor UpgradeCode and never clean the NSIS
# install). The NSIS installer has migration/uninstall logic for old msi
# installs, but not the other way around. See docs/WINDOWS_INSTALLER.md.
#
# Three entry points:
#   - push tag v*        → official GitHub Release with generated notes
#   - schedule (daily)   → rolling `nightly` prerelease (assets overwritten)
#   - workflow_dispatch  → build only; tick `upload` to publish to nightly
#
# Staleness gate (2026-09-29): on schedule triggers, compare the commit time of
# main HEAD first; if there has been no new commit for over 48h, skip the entire
# pipeline (the gate is green and build/android/release are all skipped, saving
# CI minutes). Tag and manual triggers are never skipped.
#
# Android (2026-09-30): cross-compile the persona-mobile aarch64 cdylib →
# the Flutter shell (mobile/) jniLibs → **arm64 APK** goes into an artifact
# (android-apk-arm64); the .so itself is saved separately as android-jni-arm64
# for link verification. Distribution policy (since 2026-10-01): **the nightly
# daily build ships the APK** (the download pattern includes android-apk-arm64,
# renamed to Persona_<ver>_arm64.apk); official tag releases do not ship the APK
# yet — mobile is still a minimal closed loop, opening up with a real release
# once it stabilizes.
#
# Browser extension (2026-11-14): a Chromium MV3 package (manifest.json at the
# zip root) goes into an artifact (extension-chromium); nightly gets the
# dual-named assets persona-nightly-extension-chrome.zip /
# persona-nightly-extension-edge.zip — the same package under two names for
# Chrome/Edge; plus persona-nightly-extension.crx (CRX3, drag-installable in
# Chromium, with a pinned key fixing the extension ID). Safari needs an Xcode
# conversion + a signing account, so it is **not in nightly** (tracked
# separately in todo). Official tag releases do not ship the extension yet,
# same policy as the APK.
#
# OpenWrt (2026-11-14): persona-server built as a musl static binary (x86_64 +
# aarch64) → packaging/openwrt/build-ipk.sh produces the three-package ipk set
# (the persona main package is arch-specific, luci-app/app-meta are arch=all).
# Nightly assets are persona-nightly-openwrt-*.ipk; aarch64 has no real device,
# so structural checks stand in (ELF machine + static linking + ipk members).
# Official tag releases do not ship it yet, same policy as the APK/extension.
#
# Binaries are unsigned (SmartScreen/Gatekeeper will warn on install);
# architecture-pinned per runner: linux/windows x64, macos arm64.
name: Desktop Build

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 18 * * *' # daily 02:23 Beijing, off the whole-hour marks
  workflow_dispatch:
    inputs:
      upload:
        description: '上传产物到 nightly release（覆盖旧 nightly）'
        type: boolean
        default: false

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: staleness gate
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Skip daily build when main has no fresh commits (<= 48h)
        id: gate
        shell: bash
        run: |
          # Only schedule runs get the freshness check: a tag is an official
          # release and a dispatch is a human pressing a button — neither may be
          # blocked by staleness.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "event ${GITHUB_EVENT_NAME}: always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( now - last ))
          echo "main HEAD age: ${age}s ($(date -u -d "@${last}" 2>/dev/null || date -u -r "${last}" 2>/dev/null))"
          if (( age <= 60 * 60 * 48 )); then
            echo "fresh enough (<= 48h) — build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main HEAD older than 48h — skip whole daily build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    # spike probes are designed to "fail honestly" on hardware-less VMs, but
    # they must never be allowed to hang the job
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v6.1.1
        # Version comes from the root package.json `packageManager` field
        # (pnpm@10.22.0); specifying `version` here conflicts with it.

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm

      - name: Install JS dependencies (desktop slice only)
        shell: bash
        run: pnpm install --frozen-lockfile --filter persona-desktop...

      # Update-check channel metadata (read into desktop/src/utils/updateCheck.ts
      # via vite define): daily build = nightly, compared against the latest
      # successful run of the desktop-build workflow; a future release pipeline will
      # inject VITE_UPDATE_CHANNEL=release for the release channel
      - name: Record build metadata (update-check channel)
        shell: bash
        run: |
          echo "VITE_UPDATE_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build bundles
        working-directory: desktop
        shell: bash
        env:
          VITE_UPDATE_CHANNEL: ${{ env.VITE_UPDATE_CHANNEL }}
          VITE_BUILD_SHA: ${{ env.VITE_BUILD_SHA }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

      # Biometric hardware wrapper spike (docs/biometric-unlock-design.md
      # §5.2/§6.1). The runner is a VM: macos has no Secure Enclave / Touch ID,
      # windows usually has no enrolled Hello — the probes fail honestly and dump
      # the OSStatus/HRESULT into the log; that real output is this step's
      # deliverable (to be back-filled into the design doc by hand). Not a gate:
      # the probes' ok bits do not affect the job verdict. --nocapture lets the
      # SPIKE lines reach the log.
      - name: Biometric spike probes (VM — record real capability, not a gate)
        if: runner.os != 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        # Not a gate: the probes' ok bits — or the runner environment simply not
        # being able to run the test binary (observed 0xc0000139
        # STATUS_ENTRYPOINT_NOT_FOUND on a Windows runner — a native loader
        # dependency of Tauri test binaries, see design doc §6.3) — must not
        # block packaging.
        continue-on-error: true
        run: cargo test --lib spike_probes_print_report -- --ignored --nocapture

  # persona-mobile Android cross-compilation (aarch64 cdylib) + native Kotlin APK.
  # Chain: cargo ndk produces libpersona_mobile.so (mobile-ffi profile, which
  # needs unwind for the panic defense) → copied into the Kotlin project's jniLibs
  # → gradle assembleRelease (arm64-v8a, single ABI). Artifacts only — hard rule:
  # the daily build never publishes a release (the release job's download pattern
  # matches desktop-* only, which isolates it naturally); libpersona_mobile.so is
  # also saved as the android-jni-arm64 artifact for link verification /
  # out-of-shell integration.
  android:
    name: android (aarch64 APK)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: android-aarch64

      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Build persona-mobile cdylib (arm64-v8a)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # mobile-ffi (release + unwind): a panic is converted into an error result
        # by catch_unwind at the FFI boundary — release's panic=abort would defeat
        # that defense (the process would just die)
        run: cargo ndk -t arm64-v8a build -p persona-mobile --profile mobile-ffi

      - name: Upload android jniLib artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-jni-arm64
          path: target/aarch64-linux-android/mobile-ffi/libpersona_mobile.so
          if-no-files-found: error

      - name: Bundle cdylib into Kotlin app jniLibs
        shell: bash
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/mobile-ffi/libpersona_mobile.so \
            mobile/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK (arm64-v8a, native Kotlin)
        working-directory: mobile/android
        shell: bash
        # The pure Kotlin project emits a single-ABI package directly: abiFilters
        # is already limited to arm64-v8a, so non-arm64 devices never install the
        # so-less package — a runtime UnsatisfiedLinkError is impossible
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload android APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apk-arm64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Browser extension nightly packaging (Chromium MV3): tsc produces dist/ →
  # zip (manifest.json must sit at the archive root, which Load unpacked reads
  # directly). Artifacts only — the same hard rule as the APK: the release
  # job's download pattern matches extension-chromium only on non-tag runs, so
  # official tag releases are naturally isolated.
  extension:
    name: browser extension (chromium zip)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        # Version comes from the root package.json `packageManager` field
        # (pnpm@10.22.0); specifying `version` here conflicts with it.

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies (extension slice only)
        shell: bash
        run: pnpm install --frozen-lockfile --filter persona-chromium-extension...

      - name: Build extension
        shell: bash
        run: pnpm --filter persona-chromium-extension run build

      - name: Zip package (manifest.json at archive root)
        shell: bash
        # Structural self-check before packaging: fail outright when manifest.json
        # or an entry file is missing, so a zip that cannot be installed never
        # reaches nightly.
        run: |
          cd browser/chromium-extension
          test -f manifest.json
          test -f dist/background.js
          test -f public/popup.html
          zip -qr "$GITHUB_WORKSPACE/persona-extension.zip" manifest.json public dist
          unzip -l "$GITHUB_WORKSPACE/persona-extension.zip" | awk '{print $4}' | grep -qx 'manifest.json'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-chromium
          path: persona-extension.zip
          if-no-files-found: error

  # OpenWrt IPK packaging: persona-server built statically with musl. The
  # aarch64 leg uses a native ARM runner (ubuntu-24.04-arm, per the meshlet
  # precedent) — no dependence on an external cross toolchain (musl.cc is
  # unreachable from GH runners, this has turned red once in practice); each leg
  # installs musl-tools via apt itself. The three-package ipk set
  # (persona/luci-app/app-meta) comes from build-ipk.sh; the script gates
  # (shellcheck + sh -n + luac5.1) run inline before the leg.
  openwrt:
    name: openwrt ipk (${{ matrix.arch }} musl)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: openwrt-${{ matrix.arch }}-musl

      - name: Install packaging gate tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools lua5.1 file

      - name: Validate packaging scripts (shellcheck / sh -n / luac5.1)
        shell: bash
        run: |
          shellcheck packaging/openwrt/build-ipk.sh
          sh -n packaging/openwrt/build-ipk.sh \
            packaging/openwrt/etc/init.d/persona \
            packaging/openwrt/CONTROL/postinst packaging/openwrt/CONTROL/prerm
          # LuCI app gate: parse the Lua controller/model with Lua 5.1
          # (the interpreter LuCI runs on OpenWrt).
          luac5.1 -p packaging/openwrt/usr/lib/lua/luci/controller/persona.lua \
            packaging/openwrt/usr/lib/lua/luci/model/cbi/persona.lua

      - name: Build persona-server (musl static)
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build -p persona-server --target ${{ matrix.arch }}-unknown-linux-musl --release

      - name: Package IPKs + structural checks
        shell: bash
        run: |
          set -euo pipefail
          OUT=out/openwrt
          packaging/openwrt/build-ipk.sh \
            "target/${{ matrix.arch }}-unknown-linux-musl/release" "$OUT"
          # No real aarch64 device: structural checks stand in (ELF machine +
          # static linking + ipk members + directory entries inside data.tar.gz
          # — opkg does not create parent directories for plain file members).
          # x86_64 musl is static-pie and aarch64 musl is plain static — both
          # are accepted.
          file "target/${{ matrix.arch }}-unknown-linux-musl/release/persona-server" \
            | tee /dev/stderr | grep -qE 'static-pie linked|statically linked'
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ipk="$OUT/persona_${version}-1_${{ matrix.arch }}.ipk"
          test -f "$ipk"
          tar -tzf "$ipk" | grep -qx './debian-binary'
          rm -rf /tmp/ipk-verify && mkdir /tmp/ipk-verify
          tar -xzf "$ipk" -C /tmp/ipk-verify
          tar -tzf /tmp/ipk-verify/data.tar.gz | grep -qx 'usr/'
          tar -xzOf /tmp/ipk-verify/data.tar.gz usr/bin/persona-server | file -
          find "$OUT" -type f -printf '%s %p\n' | sort -n

      # The two arch=all packages (luci-app / app-meta) only need to be uploaded
      # once, with the x86_64 leg — the aarch64 leg builds them too (for its own
      # self-check), but the artifact carries only the main package, so the
      # release download does not merge duplicate-named assets.
      - name: Upload arch ipk artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openwrt-ipk-${{ matrix.arch }}
          path: out/openwrt/persona_*_${{ matrix.arch }}.ipk
          if-no-files-found: error

      - name: Upload arch-all ipk artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openwrt-ipk-all
          path: |
            out/openwrt/luci-app-persona_*_all.ipk
            out/openwrt/app-meta-persona_*_all.ipk
          if-no-files-found: error

  # persona-relay (2026-11-23): a thin relay-node binary (same persona-server
  # routing/migration, exposing only the sync+pairing surface) — an independent
  # artifact in the manner of Syncthing's strelaysrv. Each of the four triples
  # yields persona-relay-<triple>.tar.gz (binary + LICENSE + README-relay);
  # nightly renames it to persona-nightly-relay-*. Official tag releases do not
  # ship it yet, matching the APK / extension / OpenWrt policy.
  relay:
    name: relay binary (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-linux
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: aarch64-macos
            triple: aarch64-apple-darwin
            runner: macos-latest
          - name: x86_64-windows
            triple: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: relay-${{ matrix.triple }}

      - name: Build persona-relay (release)
        shell: bash
        run: cargo build -p persona-relay --target ${{ matrix.triple }} --release

      - name: Package relay tarball + structural check
        shell: bash
        # Package the binary + LICENSE + README-relay; the structural self-check
        # only runs when the runner has the `file` tool (Linux/macOS give
        # ELF|Mach-O; Windows runners lack it, so presence + non-empty is the
        # fallback, and the MSVC toolchain's own output guarantees the PE shape).
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.triple }}/release/persona-relay"
          test -f "$BIN"
          test -s "$BIN"
          if command -v file >/dev/null 2>&1; then
            # Teeing to /dev/stderr blows up in Git Bash on a Windows runner
            # (that path does not exist, proven by the 2026-11-22 nightly
            # relay-windows run) — print to stdout directly.
            file "$BIN" | grep -qE 'ELF|Mach-O|PE32'
            file "$BIN"
          fi
          mkdir -p out/relay/stage
          cp "$BIN" out/relay/stage/persona-relay
          cp LICENSE out/relay/stage/LICENSE
          cp README-relay.md out/relay/stage/README-relay.md
          tar -czf "out/relay/persona-relay-${{ matrix.triple }}.tar.gz" -C out/relay/stage .
          ls -la out/relay/stage

      - name: Upload relay tarball
        uses: actions/upload-artifact@v7.0.2
        with:
          name: relay-${{ matrix.triple }}
          path: out/relay/persona-relay-*.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: [gate, build, android, extension, openwrt, relay]
    if: >-
      needs.gate.outputs.should_build == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      inputs.upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # nightly/dispatch ship the APK + extension zip + OpenWrt ipks + the relay
      # binaries; official tag releases ship desktop bundles only (see the file
      # header for the policy). needs already lists every build job, so the
      # artifacts are guaranteed to be present.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ startsWith(github.ref, 'refs/tags/v') && 'desktop-*' || '{desktop-*,android-apk-arm64,extension-chromium,openwrt-ipk-*,relay-*}' }}
          path: dist
          merge-multiple: true

      - name: Rename Android APK (match desktop asset naming)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if [ -f dist/app-release.apk ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            mv dist/app-release.apk "dist/Persona_${version}_arm64.apk"
            echo "renamed to Persona_${version}_arm64.apk"
          else
            echo "::error::android APK missing from downloaded artifacts"
            exit 1
          fi

      - name: Rename extension zip (Chrome/Edge dual-name, same package)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # The same Chromium package under two names: Chrome's and Edge's store
        # pages each expect their own filename, and the contents are
        # byte-for-byte identical (same SHA256).
        run: |
          if [ -f dist/persona-extension.zip ]; then
            cp dist/persona-extension.zip dist/persona-nightly-extension-chrome.zip
            cp dist/persona-extension.zip dist/persona-nightly-extension-edge.zip
            rm dist/persona-extension.zip
            echo "dual-named chrome/edge extension zips"
          else
            echo "::error::extension zip missing from downloaded artifacts"
            exit 1
          fi

      - name: Build extension CRX3 (drag-install package)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # CRX3 = the wrapper Chromium can install by drag-and-drop (a zip needs
        # developer-mode load-unpacked). The fixed key
        # packaging/extension/persona-crx.pem pins the extension ID: changing
        # the key = changing the ID = losing all settings after upgrading an
        # older version, so it must never be regenerated per build. Tool: the
        # crx3 npm package (protocol header Cr24 v3, verified locally).
        run: |
          test -f dist/persona-nightly-extension-chrome.zip
          rm -rf /tmp/persona-crx-src && mkdir -p /tmp/persona-crx-src
          unzip -q dist/persona-nightly-extension-chrome.zip -d /tmp/persona-crx-src
          test -f /tmp/persona-crx-src/manifest.json
          npx --yes crx3@latest \
            --keyPath packaging/extension/persona-crx.pem \
            --crxPath dist/persona-nightly-extension.crx \
            /tmp/persona-crx-src
          # Structural gate: CRX3 header (Cr24 v3) + non-zero size
          head -c4 dist/persona-nightly-extension.crx | grep -q "Cr24"
          [ "$(stat -c%s dist/persona-nightly-extension.crx)" -gt 100 ]
          echo "crx3 package OK"

      - name: Rename OpenWrt ipks (nightly naming)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # The main package comes out per architecture as
        # persona-nightly-openwrt-<arch>.ipk; the LuCI UI and iStore metadata
        # packages are arch=all, shared by both architectures.
        run: |
          ok=1
          for pair in \
            "persona_*_x86_64.ipk:persona-nightly-openwrt-x86_64.ipk" \
            "persona_*_aarch64.ipk:persona-nightly-openwrt-aarch64.ipk" \
            "luci-app-persona_*_all.ipk:persona-nightly-openwrt-luci-app-all.ipk" \
            "app-meta-persona_*_all.ipk:persona-nightly-openwrt-app-meta-all.ipk"
          do
            src="${pair%%:*}"
            dst="${pair##*:}"
            # set -- expands the glob (a quoted test would compare the
            # literal pattern); build-ipk emits exactly one match each.
            # shellcheck disable=SC2086  # glob expansion is the point
            set -- dist/$src
            if [ -f "$1" ]; then
              mv "$1" "dist/$dst"
              echo "renamed to $dst"
            else
              echo "::error::openwrt ipk missing from downloaded artifacts: $src"
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Rename relay tarballs (nightly naming)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # One package per relay triple; nightly naming is
        # persona-nightly-relay-<os>.tar.gz.
        run: |
          ok=1
          for pair in \
            "persona-relay-x86_64-unknown-linux-gnu.tar.gz:persona-nightly-relay-x86_64-linux.tar.gz" \
            "persona-relay-aarch64-unknown-linux-gnu.tar.gz:persona-nightly-relay-aarch64-linux.tar.gz" \
            "persona-relay-aarch64-apple-darwin.tar.gz:persona-nightly-relay-aarch64-macos.tar.gz" \
            "persona-relay-x86_64-pc-windows-msvc.tar.gz:persona-nightly-relay-x86_64-windows.tar.gz"
          do
            src="${pair%%:*}"
            dst="${pair##*:}"
            if [ -f "dist/$src" ]; then
              mv "dist/$src" "dist/$dst"
              echo "renamed to $dst"
            else
              echo "::error::relay tarball missing from downloaded artifacts: $src"
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1

      - name: Generate SHA256SUMS + asset manifest (nightly only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        # Temp files go outside dist: the shell creates the redirection target
        # before running find, so a file written inside dist would be picked up
        # by its own walk (the self-check would always be FAILED). Place it with
        # mv.
        run: |
          cd dist
          find . -type f -printf '%P\0' | sort -z \
            | xargs -0 sha256sum > ../SHA256SUMS.tmp
          {
            echo "# persona nightly assets — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "# extension-chrome/edge are the same package under two names"
            echo "# extension .crx is the CRX3 drag-install package (pinned extension id)"
            echo "# Safari is not shipped in nightly (needs Xcode conversion + signing)"
            while IFS= read -r f; do
              printf '%-64s %10s\n' "$f" "$(du -h "$f" | cut -f1)"
            done < <(find . -type f -printf '%P\n' | sort)
          } > ../ASSETS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
          mv ../ASSETS.tmp ASSETS.txt

      - name: Compute release target
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly build $(date -u +%F)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify downloaded bundles
        shell: bash
        run: |
          found=$(find dist -type f | wc -l)
          if [ "$found" -eq 0 ]; then
            echo "::error::no bundle files found under dist/"
            exit 1
          fi
          find dist -type f -printf '%s %p\n' | sort -n

      - name: Remove previous nightly release
        if: steps.rel.outputs.tag == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ steps.rel.outputs.prerelease == 'false' }}
          # artifacts keep their bundler subdirectories (deb/, nsis/, ...)
          files: dist/**/*
