name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust (core/cli/server/agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: coverage
        run: |
          mkdir -p coverage
          # Files excluded here drive real terminals, raw TTY input or process
          # entry points and cannot execute under the test harness. Their
          # testable logic lives in sibling files that are measured.
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '(cli/src/main\.rs|cli/src/commands/tui_runtime\.rs|cli/src/utils/terminal_ui\.rs|server/src/main\.rs|agents/ssh-agent/src/daemon\.rs|agents/ssh-agent/src/main\.rs)'
      - name: Upload coverage (rust) to Codecov
        uses: codecov/codecov-action@v7
        with:
          # token 必须显式传：tokenless 上传对默认分支被 codecov 拒绝
          # （"Token required because branch is protected"，2026-10-03 实锤，
          # 徽章因此长期 unknown）。secrets.CODECOV_TOKEN 早已配置但从未接线。
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-lcov.info
          flags: rust
          fail_ci_if_error: false

  rust-windows:
    name: Rust (Windows build/test)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: build
        run: cargo build --workspace --all-features
      # 归因探针：直接跑 persona --version。此前 ci 集成测试（18 个全是
      # assert_cmd 起子进程）在 windows runner 上零输出挂死到 120 分钟
      # job 超时（run 36263457552：单测 358/359 全过后集成二进制零完成）。
      # 这个探针把「二进制启动即挂」与「个别测试挂」区分开：30 秒不退
      # 即失败并指认二进制层面，不再烧整个 job。
      - name: probe persona binary starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target\debug\persona.exe" -ArgumentList "--version" -PassThru -NoNewWindow -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt
          if ($p.WaitForExit(30000)) {
            Get-Content probe-out.txt, probe-err.txt
            Write-Host "PROBE: persona --version exited with code $($p.ExitCode)"
          } else {
            Stop-Process -Id $p.Id -Force
            Get-Content probe-out.txt, probe-err.txt -ErrorAction SilentlyContinue
            Write-Host "::error::PROBE: persona --version hung for 30s - binary-level startup hang, not a per-test issue"
            exit 1
          }
      # cargo test 的测试二进制一旦有测试挂死，整个二进制（连同日志与后
      # 续 crate）一起陪葬。nextest 每个测试独立进程 + 慢测试强杀
      # （.config/nextest.toml：60s 标记、240s 终止），挂死测试会带名字
      # 报出来，其余测试照常完成。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: test (nextest, per-test timeout)
        run: cargo nextest run --workspace --all-features --profile ci
      # nextest 不跑 doctest，单独补齐与 cargo test 等价的覆盖面
      - name: test doc
        run: cargo test --workspace --all-features --doc --no-fail-fast
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-deny
        run: cargo deny check
      - name: Run cargo-audit
        run: cargo audit
        continue-on-error: true # Don't fail CI on advisories, just warn

  desktop:
    name: Desktop (Tauri + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # --- Desktop Rust (src-tauri is its own workspace, invisible to the
      # `rust` job's --workspace runs) ---
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache desktop cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Desktop Rust fmt
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop Rust clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter persona-desktop run lint
      - name: Tests
        run: pnpm --filter persona-desktop run test:ci:coverage
      - name: Upload coverage (desktop) to Codecov
        uses: codecov/codecov-action@v7
        with:
          # 同上：默认分支上传必须带 token，否则徽章 unknown
          token: ${{ secrets.CODECOV_TOKEN }}
          files: desktop/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: false
      - name: Security Audit
        run: pnpm --filter persona-desktop audit --audit-level=moderate
        continue-on-error: true # Don't fail CI on moderate vulnerabilities

  web:
    name: Web (extension + website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build Chromium extension
        run: pnpm --filter persona-chromium-extension run build
      - name: Build website
        run: pnpm --filter persona-website run build
