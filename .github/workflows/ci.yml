name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  rust:
    name: Rust (core/cli/server/agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: coverage
        run: |
          mkdir -p coverage
          # Files excluded here drive real terminals, raw TTY input or process
          # entry points and cannot execute under the test harness. Their
          # testable logic lives in sibling files that are measured.
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '(cli/src/main\.rs|cli/src/commands/tui_runtime\.rs|cli/src/utils/terminal_ui\.rs|server/src/main\.rs|agents/ssh-agent/src/daemon\.rs|agents/ssh-agent/src/main\.rs)'
      - name: Upload coverage (rust) to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          # The token must be passed explicitly: tokenless uploads are rejected by
          # codecov for the default branch ("Token required because branch is
          # protected", confirmed 2026-10-03, and the badge stayed unknown for a
          # long time). secrets.CODECOV_TOKEN was configured long ago but never wired up.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-lcov.info
          flags: rust
          fail_ci_if_error: false

  rust-windows:
    name: Rust (Windows build/test)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: build
        run: cargo build --workspace --all-features
      # Attribution probe: run persona --version directly. Previously the CI
      # integration tests (18 of them, all spawning subprocesses via assert_cmd)
      # hung with zero output on the windows runner until the 120-minute job
      # timeout (run 36263457552: 358/359 unit tests passed, then the integration
      # binary never finished). This probe distinguishes "the binary hangs on
      # startup" from "an individual test hangs": no exit within 30s fails and
      # blames the binary layer instead of burning the whole job.
      - name: probe persona binary starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target\debug\persona.exe" -ArgumentList "--version" -PassThru -NoNewWindow -RedirectStandardOutput probe-out.txt -RedirectStandardError probe-err.txt
          if ($p.WaitForExit(30000)) {
            Get-Content probe-out.txt, probe-err.txt
            Write-Host "PROBE: persona --version exited with code $($p.ExitCode)"
          } else {
            Stop-Process -Id $p.Id -Force
            Get-Content probe-out.txt, probe-err.txt -ErrorAction SilentlyContinue
            Write-Host "::error::PROBE: persona --version hung for 30s - binary-level startup hang, not a per-test issue"
            exit 1
          }
      # With cargo test, one hung test takes the whole test binary down with it
      # (along with its logs and every later crate). nextest runs each test in its
      # own process and force-kills slow ones (.config/nextest.toml: 60s marked
      # slow, 240s terminated), so hung tests are reported by name while the rest
      # still finish.
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-nextest
      - name: test (nextest, per-test timeout)
        run: cargo nextest run --workspace --all-features --profile ci
      # nextest does not run doctests; run them separately to match cargo test's coverage
      - name: test doc
        run: cargo test --workspace --all-features --doc --no-fail-fast
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # desktop/src-tauri is its own workspace, invisible to rust-windows above.
  # Compile-layer guard only: runtime behaviors (named-pipe approval flow,
  # TPM biometric, NSIS installer) still need a real Windows desktop session.
  rust-windows-desktop:
    name: Rust (Windows desktop src-tauri check)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: check (windows msvc)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-deny
        run: cargo deny check
      - name: Run cargo-audit
        # cargo-audit's built-in gix clone keeps failing on the runner ("failed to
        # prepare clone"), so pre-clone advisory-db with system git and audit
        # offline. It must not go under $CARGO_HOME — cargo-deny already uses that
        # advisory-db directory
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db"
          cargo audit --db "$RUNNER_TEMP/advisory-db" --no-fetch

  desktop:
    name: Desktop (Tauri + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # --- Desktop Rust (src-tauri is its own workspace, invisible to the
      # `rust` job's --workspace runs) ---
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache desktop cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Desktop Rust fmt
        # --all: src-tauri is a standalone workspace and by default only formats
        # its own package, which misses the fill-test member
        run: cargo fmt --all --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop Rust clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter persona-desktop run lint
      - name: Tests
        run: pnpm --filter persona-desktop run test:ci:coverage
      - name: Upload coverage (desktop) to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          # Same as above: default-branch uploads need the token or the badge shows unknown
          token: ${{ secrets.CODECOV_TOKEN }}
          files: desktop/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: false
      - name: Security Audit
        # pnpm 10's audit does not support --filter (the old spelling reports
        # Unknown option: 'recursive'), and the audit already runs against the
        # workspace-wide lockfile anyway, so audit at the root
        run: pnpm audit --audit-level=moderate

  web:
    name: Web (extension + website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build Chromium extension
        run: pnpm --filter persona-chromium-extension run build
      # The extension's jest suite (form scanning / domain policy / save
      # proposals / native bridge signatures...) previously ran only locally with
      # no CI gate — changes on the write path must clear it before landing on main.
      - name: Test Chromium extension
        run: pnpm --filter persona-chromium-extension run test
      - name: Build website
        run: pnpm --filter persona-website run build
