name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust:
    name: Rust (core/cli/server/agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: coverage
        run: |
          mkdir -p coverage
          # Files excluded here drive real terminals, raw TTY input or process
          # entry points and cannot execute under the test harness. Their
          # testable logic lives in sibling files that are measured.
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '(cli/src/main\.rs|cli/src/commands/tui_runtime\.rs|cli/src/utils/terminal_ui\.rs|server/src/main\.rs|agents/ssh-agent/src/daemon\.rs|agents/ssh-agent/src/main\.rs)'
      - name: Upload coverage (rust) to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/rust-lcov.info
          flags: rust
          fail_ci_if_error: false

  rust-windows:
    name: Rust (Windows build/test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: build
        run: cargo build --workspace --all-features
      - name: test
        run: cargo test --workspace --all-features
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo-deny
        run: cargo deny check
      - name: Run cargo-audit
        run: cargo audit
        continue-on-error: true # Don't fail CI on advisories, just warn

  desktop:
    name: Desktop (Tauri + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter persona-desktop run lint
      - name: Tests
        run: pnpm --filter persona-desktop run test:ci:coverage
      - name: Upload coverage (desktop) to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: desktop/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: false
      - name: Security Audit
        run: pnpm --filter persona-desktop audit --audit-level=moderate
        continue-on-error: true # Don't fail CI on moderate vulnerabilities

  web:
    name: Web (extension + website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build Chromium extension
        run: pnpm --filter persona-chromium-extension run build
      - name: Build website
        run: pnpm --filter persona-website run build
