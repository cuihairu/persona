name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/persona-server

      - name: Build and push Docker image
        timeout-minutes: 15
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make GHCR package public
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: persona-server
        continue-on-error: true
        run: |
          set -euo pipefail
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi

  # ---- persona-relay（RELAY-DOCKER-1124）：独立镜像、独立 tag ----
  # 多架构 amd64 + arm64，与四平台二进制 release 面呼应。两腿在各自**原生**
  # runner 上 buildx 构建并推 -amd64/-arm64 后缀 tag，merge-relay-manifest 把
  # 两腿合成多架构 manifest。刻意不用 qemu 交叉编译：amd64 runner 上交叉编
  # arm64 的 Rust release（本工作区 release 体积）需 50-150 min，首次推送即有
  # 超时风险；公共仓的 ubuntu-24.04-arm 原生 runner 使两腿耗时与 build-server
  # 同量级（relay 只编 persona-relay 一个二进制，比 server 还小）。
  build-relay:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/persona-relay
          # tag 策略：v* → semver（与 persona-server 同构）；main 分支推送或
          # workflow_dispatch → 滚动 nightly（与 nightly release 节奏对齐）；
          # PR → pr-N（不推送）。每腿推带架构后缀的 tag，由 merge job 合成。
          tags: |
            type=semver,pattern={{version}}-${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.suffix }}
            type=raw,value=nightly-${{ matrix.suffix }},enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push relay image (${{ matrix.platform }})
        timeout-minutes: 35
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.relay
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 两腿架构 tag 合成多架构 manifest：v* → 1.2.3 + 1.2；main → nightly。
  # 无 checkout（imagetools 只操作 registry，不读仓库）。
  merge-relay-manifest:
    needs: build-relay
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifests
        timeout-minutes: 5
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          img="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/persona-relay"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              ver="${GITHUB_REF#refs/tags/v}"
              minor="${ver%.*}"
              tags=("$ver" "$minor")
              ;;
            *)
              tags=("nightly")
              ;;
          esac
          for t in "${tags[@]}"; do
            # 两段式版本 tag（v1.0）等形态下 metadata 的 semver 规则可能不产出
            # 对应架构 tag——守卫缺源，避免 imagetools 缺镜像硬失败打红。
            for a in amd64 arm64; do
              if ! docker buildx imagetools inspect "${img}:${t}-${a}" >/dev/null 2>&1; then
                echo "Skipping ${img}:${t} (missing ${img}:${t}-${a})"
                continue 2
              fi
            done
            echo "Merging ${img}:${t} from -amd64 and -arm64"
            docker buildx imagetools create -t "${img}:${t}" \
              "${img}:${t}-amd64" "${img}:${t}-arm64"
          done

      - name: Make GHCR package public
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: persona-relay
        continue-on-error: true
        run: |
          set -euo pipefail
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi
