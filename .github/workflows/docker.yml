name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/persona-server

      - name: Build and push Docker image
        timeout-minutes: 15
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make GHCR package public
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: persona-server
        continue-on-error: true
        run: |
          set -euo pipefail
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi

  # ---- persona-relay (RELAY-DOCKER-1124): separate image, separate tags ----
  # Multi-arch amd64 + arm64, mirroring the four-platform binary release surface.
  # Each leg is built by buildx on its own **native** runner and pushed as a
  # -amd64/-arm64 suffixed tag; merge-relay-manifest then combines the two legs
  # into a multi-arch manifest. QEMU cross-compilation is deliberately avoided:
  # cross-building the arm64 Rust release (workspace release size) on an amd64
  # runner takes 50-150 min, which risks a timeout on the very first push; the
  # public repo's native ubuntu-24.04-arm runner keeps both legs in the same
  # ballpark as build-server (relay builds only the persona-relay binary, smaller
  # than the server).
  build-relay:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        timeout-minutes: 3
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/persona-relay
          # Tag policy: v* → semver (same shape as persona-server); pushes to
          # main or workflow_dispatch → rolling nightly (aligned with the nightly
          # release cadence); PRs → pr-N (not pushed). Each leg pushes a tag with
          # an arch suffix, merged by the merge job.
          tags: |
            type=semver,pattern={{version}}-${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.suffix }}
            type=raw,value=nightly-${{ matrix.suffix }},enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push relay image (${{ matrix.platform }})
        timeout-minutes: 35
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile.relay
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Combine the two legs' arch tags into a multi-arch manifest:
  # v* → 1.2.3 + 1.2; main → nightly.
  # No checkout (imagetools only talks to the registry, it never reads the repo).
  merge-relay-manifest:
    needs: build-relay
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifests
        timeout-minutes: 5
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          img="ghcr.io/$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')/persona-relay"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              ver="${GITHUB_REF#refs/tags/v}"
              minor="${ver%.*}"
              tags=("$ver" "$minor")
              ;;
            *)
              tags=("nightly")
              ;;
          esac
          for t in "${tags[@]}"; do
            # Under tag shapes like the two-part semver form (v1.0), metadata's
            # semver rules may not produce the matching arch tags — guard against
            # a missing source so imagetools does not hard-fail on a missing image
            # and turn the run red.
            for a in amd64 arm64; do
              if ! docker buildx imagetools inspect "${img}:${t}-${a}" >/dev/null 2>&1; then
                echo "Skipping ${img}:${t} (missing ${img}:${t}-${a})"
                continue 2
              fi
            done
            echo "Merging ${img}:${t} from -amd64 and -arm64"
            docker buildx imagetools create -t "${img}:${t}" \
              "${img}:${t}-amd64" "${img}:${t}-arm64"
          done

      - name: Make GHCR package public
        timeout-minutes: 3
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_OWNER_SCOPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: persona-relay
        continue-on-error: true
        run: |
          set -euo pipefail
          scope="${GH_OWNER_SCOPE}/${GH_OWNER}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/${scope}/packages/container/${PKG}" || true)
            echo "Probe ${scope}/packages/container/${PKG} -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Package ${PKG} set to public via ${scope}"
          else
            echo "Skipping GHCR visibility update for ${PKG} (HTTP $code)"
          fi
